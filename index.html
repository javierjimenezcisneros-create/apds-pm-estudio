/* ── Render Alejandra — DIRECCIÓN ─────────────────────────── */
/* ── Parser de fechas del Master (texto libre) ───────────────────────────────
   Acepta: 'Nov 2026', '3 dic 2026', '20 ene 2027', '~20 nov 2026',
           'Fin nov 2026', 'Nov/Dic 2026' (usa el primer mes), 'Sem Santa 2027' → null,
           'Dic'26' (formato antiguo), '3 oct'26'.
   Devuelve Date con hora 00:00 o null si no parseable / muy vago.
   Para meses sin día concreto devuelve el día 1.                            */
function _parseFechaMaster(str) {
  if (!str || str === '—' || str === '' ) return null;
  const MESES = {ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,oct:9,nov:10,dic:11,
                 jan:0,feb:1,aug:7,sep:8,oct:9,nov:10,dec:11};
  const s = str.replace(/[~*]/g,'').trim().toLowerCase();
  // "3 dic 2026" / "20 ene 2027"
  let m = s.match(/(\d{1,2})\s+([a-záéíóú]{3})\s+(20\d{2})/);
  if (m) { const mes=MESES[m[2]]; if(mes!==undefined) return new Date(+m[3],mes,+m[1]); }
  // "dic 2026" / "nov 2026" (mes año)
  m = s.match(/([a-záéíóú]{3})\s+(20\d{2})/);
  if (m) { const mes=MESES[m[1]]; if(mes!==undefined) return new Date(+m[2],mes,1); }
  // "nov/dic 2026" → usa primer mes
  m = s.match(/([a-záéíóú]{3})\/[a-záéíóú]{3}\s+(20\d{2})/);
  if (m) { const mes=MESES[m[1]]; if(mes!==undefined) return new Date(+m[2],mes,1); }
  // "3 oct'26" / "dic'26"
  m = s.match(/(\d{1,2})\s+([a-záéíóú]{3})'(\d{2})/);
  if (m) { const mes=MESES[m[2]]; if(mes!==undefined) return new Date(2000+parseInt(m[3]),mes,+m[1]); }
  m = s.match(/([a-záéíóú]{3})'(\d{2})/);
  if (m) { const mes=MESES[m[1]]; if(mes!==undefined) return new Date(2000+parseInt(m[2]),mes,1); }
  return null;
}

/* Días que faltan desde hoy hasta una fecha del Master (texto libre).
   Devuelve número (puede ser negativo = ya pasó) o null si no parseable. */
function _diasHastaMaster(str) {
  const d = _parseFechaMaster(str);
  if (!d) return null;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  return Math.round((d - hoy) / 86400000);
}

/* Texto corto para mostrar fecha del Master */
function _fmtMaster(str) {
  if (!str || str === '—') return '—';
  // Limpiar prefijos como "~", "Fin ", "Sem Santa..."
  return str.replace(/^~/,'').trim();
}

function renderAlejandra() {
  // Pantalla de dirección: combina datos del Excel (MASTER_DATA) con JSON de intervenciones.
  // ── Bloque 1: INTERVENCIONES PENDIENTES — proyectos con intervencion_ale === 'Sí' (Excel)
  // ── Bloque 2: HITOS PRÓXIMOS — entregas/fin_obra/montaje en los próximos 21 días (Excel)
  // ── Bloque 3: ALERTAS PARA ALEJANDRA — JSON escalado por PM (decisiones/aprobaciones urgentes)
  // ── Bloque 4: RESUELTAS — JSON resueltas con decisión adoptada
  const sem = hoySemana();
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const VENTANA_HITOS = 14; // días

  // ── Datos del Excel ──────────────────────────────────────────
  const master = (typeof MASTER_DATA !== 'undefined') ? (MASTER_DATA || []) : [];

  // Bloque 1: proyectos con intervención explícita de Alejandra marcada en el Excel
  const conIntervencion = master.filter(p =>
    (p.intervencion_ale || '').toLowerCase() === 'sí' ||
    (p.intervencion_ale || '').toLowerCase() === 'si'
  ).sort((a, b) => {
    // Ordenar: ALERTA primero, luego ATENCIÓN ALTA, luego resto
    const ord = {'ALERTA':0,'ATENCIÓN ALTA':1,'ATENCIÓN MAXIMA':0};
    const oa = ord[(a.atencion||'').toUpperCase()] ?? 2;
    const ob = ord[(b.atencion||'').toUpperCase()] ?? 2;
    return oa - ob;
  });

  // Bloque 2: hitos próximos — cualquier proyecto con fecha relevante en los próximos 21 días
  // No requiere intervencion_ale. Excluye proyectos PARADO.
  const hitosProximos = [];
  master.forEach(p => {
    if ((p.atencion||'').toUpperCase() === 'PARADO') return;
    const slots = [
      { label: 'Fin de obra',         valor: p.fin_obra  },
      { label: 'Montaje',             valor: p.montaje   },
      { label: 'Finalización oficial',valor: p.entrega   },
      { label: p.hito || 'Hito',      valor: p.fecha,    esPrincHito: true },
    ];
    slots.forEach(sl => {
      if (!sl.valor || sl.valor === '—' || sl.valor === '') return;
      const dias = _diasHastaMaster(sl.valor);
      if (dias === null) return;
      if (dias >= 0 && dias <= VENTANA_HITOS) {
        hitosProximos.push({
          nombre: p.nombre, dept: p.dept, atencion: p.atencion,
          label: sl.label, valor: sl.valor, dias,
          intervencion_ale: p.intervencion_ale
        });
      }
    });
  });
  // Ordenar por días restantes, luego nombre
  hitosProximos.sort((a, b) => a.dias - b.dias || a.nombre.localeCompare(b.nombre));
  // Deduplicar: si un proyecto aparece varias veces el mismo día, agrupar (misma fecha/proyecto)
  const hitosKey = new Set();
  const hitosDedup = hitosProximos.filter(h => {
    const k = `${h.nombre}|${h.dias}|${h.label}`;
    if (hitosKey.has(k)) return false;
    hitosKey.add(k); return true;
  });

  // ── Datos del JSON (escalado por PM) ─────────────────────────
  const int_d = (typeof INTERVENCIONES_DIR !== 'undefined') ? INTERVENCIONES_DIR : null;
  const obj   = (typeof OBJETIVOS_SEMANA   !== 'undefined') ? OBJETIVOS_SEMANA   : null;

  const intPublicado = int_d && int_d.estado_publicacion === 'Publicado';
  const objPublicado = obj  && obj.estado_publicacion    === 'Publicado';
  const cicloValido  = intPublicado && objPublicado && (obj.semana === sem);

  // Bloque 3: alertas escaladas por PM (JSON) — solo si ciclo publicado
  const todasJSON = cicloValido
    ? (int_d.intervenciones || []).filter(i => i.escalado_por === 'PM')
    : [];

  const alertasEscaladas = todasJSON.filter(i => {
    if (i.estado === 'Resuelta' || i.estado === 'Descartada') return false;
    return true;
  }).sort((a,b) => (a.fecha_limite||'').localeCompare(b.fecha_limite||''));

  // Bloque 4: resueltas recientemente (JSON)
  const intResueltas = todasJSON
    .filter(i => i.estado === 'Resuelta' && i.decision_adoptada)
    .sort((a,b) => (b.fecha_resolucion||'').localeCompare(a.fecha_resolucion||''))
    .slice(0, 7);

  // ── Recuento para cabecera ───────────────────────────────────
  const totalPendExcel = conIntervencion.length;
  const totalHitos     = hitosDedup.length;
  const totalAlertas   = alertasEscaladas.length;

  // ── Cabecera ─────────────────────────────────────────────────
  const subParts = [];
  if (totalPendExcel) subParts.push(`${totalPendExcel} intervención${totalPendExcel!==1?'es':''}`);
  if (totalHitos)     subParts.push(`${totalHitos} hito${totalHitos!==1?'s':''} próximo${totalHitos!==1?'s':''}`);
  if (totalAlertas)   subParts.push(`${totalAlertas} alerta${totalAlertas!==1?'s':''} PM`);
  const subLine = subParts.length ? ' · ' + subParts.join(' · ') : '';

  // ── Índice de navegación ─────────────────────────────────────
  // Pre-calcular ausencias para el índice
  const _ausAleLen = (() => {
    const aus = (typeof AUSENCIAS_EQUIPO !== 'undefined') ? (AUSENCIAS_EQUIPO || []) : [];
    if (!aus.length) return 0;
    const hoyTmp = new Date(); hoyTmp.setHours(0,0,0,0);
    const limite = new Date(hoyTmp.getTime() + 60 * 86400000);
    const masterTmp = (typeof MASTER_DATA !== 'undefined') ? (MASTER_DATA || []) : [];
    const proyAct = masterTmp.filter(p => {
      if ((p.atencion||'').toUpperCase()==='PARADO') return false;
      const eq = p.equipo;
      if (!eq) return false;
      return Array.isArray(eq) ? eq.length > 0 : (eq.trim() !== '' && eq !== '—');
    });
    return aus.filter(a => {
      const fin = new Date(a.fin||a.inicio); fin.setHours(23,59,59,999);
      const ini = new Date(a.inicio); ini.setHours(0,0,0,0);
      if (fin < hoyTmp || ini > limite) return false;
      const n = (a.persona||'').toLowerCase();
      const proyP = proyAct.filter(p => {
        const eq = p.equipo;
        if (Array.isArray(eq)) return eq.some(x=>(x||'').toLowerCase().trim()===n);
        return (eq||'').toLowerCase().split(/[/,\s]+/).some(x=>x.trim()===n);
      });
      const tieneAle = proyP.some(p=>(p.intervencion_ale||'').toLowerCase()==='sí'||(p.intervencion_ale||'').toLowerCase()==='si');
      return proyP.length > 0 || tieneAle;
    }).length;
  })();

  const indiceHtml = `
    <div class="idx-nav" style="margin-bottom:20px;">
      ${conIntervencion.length ? indexBtn('ale-intervenciones', 'INTERVENCIONES',  'var(--bg2)', '#8b3a00',    conIntervencion.length) : ''}
      ${hitosDedup.length      ? indexBtn('ale-hitos',          'HITOS PRÓXIMOS',  'var(--bg2)', BORDE_PROX,   hitosDedup.length)      : ''}
      ${alertasEscaladas.length? indexBtn('ale-alertas',        '● ALERTAS · PM',  BG_ALERTA,   '#8b0000',    alertasEscaladas.length): ''}
      ${intResueltas.length    ? indexBtn('ale-resueltas',      'RESUELTAS',       'var(--bg2)', '#2a7a2a',    intResueltas.length)    : ''}
      ${_ausAleLen             ? indexBtn('bloque-ausencias',   'AUSENCIAS',       'var(--bg2)', '#b06000',    _ausAleLen)             : ''}
    </div>`;

  let html = `<div class="view-head">
    <div>
      <div class="view-title">DIRECCIÓN</div>
      <div class="view-sub">${sem}${subLine}</div>
    </div>
  </div>
  ${indiceHtml}`;

  // ── Bloque 1: Intervenciones pendientes (Excel) ──────────────
  if (conIntervencion.length) {
    function aleAtTag(a) {
      const v = (a||'').toUpperCase();
      if (v === 'ALERTA' || v === 'ATENCIÓN MAXIMA')
        return `<span style="font-size:9px;font-weight:700;color:#8b0000;text-transform:uppercase;letter-spacing:.5px;">● ${a}</span>`;
      if (v === 'ATENCIÓN ALTA')
        return `<span style="font-size:9px;font-weight:700;color:#b06000;text-transform:uppercase;letter-spacing:.5px;">${a}</span>`;
      return `<span style="font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;">${a}</span>`;
    }
    html += `<div id="ale-intervenciones" class="panel" style="background:var(--bg2);border-left:3px solid #8b3a00;">
      <div class="panel-head">
        <span class="eyebrow" style="color:#8b3a00;">INTERVENCIONES PENDIENTES</span>
        <span style="font-size:11px;color:var(--ink3);font-weight:300;margin-left:6px;">${conIntervencion.length} proyecto${conIntervencion.length!==1?'s':''} · marcados en el Master</span>
      </div>
      <div class="tbl-wrap"><table class="tbl" style="width:100%;">
        <thead><tr>
          <th style="width:22%;">Proyecto</th>
          <th style="width:12%;">Estado</th>
          <th style="width:54%;">Por qué interviene Alejandra</th>
          <th style="width:12%;">Próx. hito</th>
        </tr></thead>
        <tbody>${conIntervencion.map(p => `<tr style="border-top:1px solid var(--rule);">
          <td style="padding:7px 4px 7px 0;font-size:12px;font-weight:500;vertical-align:top;">${p.nombre||'—'}<br>
            <span style="font-size:10px;color:var(--ink3);font-weight:400;">${p.dept||''}</span></td>
          <td style="padding:7px 4px;vertical-align:top;">${aleAtTag(p.atencion)}</td>
          <td style="padding:7px 4px;font-size:11.5px;color:var(--ink2);vertical-align:top;">${p.motivo_ale||p.hito||'—'}</td>
          <td style="padding:7px 0 7px 4px;font-size:11px;color:var(--ink3);vertical-align:top;">${_fmtMaster(p.fecha)}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>`;
  }

  // ── Bloque 1b: ATENCIÓN URGENTE — por estado del proyecto (sin sesión Ale requerida) ──
  const proyUrgentes = (typeof ALE_URGENTE !== 'undefined' ? ALE_URGENTE : [])
    .filter(p => p.nivel === 'ATENCIÓN MÁXIMA' || p.nivel === 'ATENCIÓN ALTA')
    .sort((a, b) => {
      if (a.nivel === 'ATENCIÓN MÁXIMA' && b.nivel !== 'ATENCIÓN MÁXIMA') return -1;
      if (b.nivel === 'ATENCIÓN MÁXIMA' && a.nivel !== 'ATENCIÓN MÁXIMA') return 1;
      return a.nombre.localeCompare(b.nombre);
    });

  if (proyUrgentes.length) {
    html += `<div id="ale-urgente" class="panel" style="background:var(--bg2);border-left:3px solid #c06000;">
      <div class="panel-head">
        <span class="eyebrow" style="color:#c06000;">ATENCIÓN URGENTE</span>
        <span style="font-size:11px;color:var(--ink3);font-weight:300;margin-left:6px;">${proyUrgentes.length} proyecto${proyUrgentes.length!==1?'s':''} · urgencia por estado, no por sesión</span>
      </div>
      <div class="tbl-wrap"><table class="tbl" style="width:100%;">
        <thead><tr>
          <th style="width:24%;">Proyecto</th>
          <th style="width:14%;">Nivel</th>
          <th style="width:46%;">Próximo hito / situación</th>
          <th style="width:16%;">Fecha</th>
        </tr></thead>
        <tbody>${proyUrgentes.map(p => {
          const esMax = p.nivel === 'ATENCIÓN MÁXIMA';
          const nivelColor = esMax ? '#8b0000' : '#c06000';
          const nivelIcon  = esMax ? '●' : '▲';
          return `<tr style="border-top:1px solid var(--rule);">
            <td style="padding:7px 4px 7px 0;font-size:12px;font-weight:500;vertical-align:top;">${p.nombre||'—'}<br>
              <span style="font-size:10px;color:var(--ink3);font-weight:400;">${p.dept||''}</span></td>
            <td style="padding:7px 4px;vertical-align:top;">
              <span style="font-size:9px;font-weight:700;color:${nivelColor};text-transform:uppercase;letter-spacing:.5px;">${nivelIcon} ${p.nivel}</span></td>
            <td style="padding:7px 4px;font-size:11.5px;color:var(--ink2);vertical-align:top;">${p.hito||'—'}${p.bloqueador && p.bloqueador !== '—' ? '<br><span style="font-size:10px;color:#8b0000;">⚠ ' + p.bloqueador + '</span>' : ''}</td>
            <td style="padding:7px 0 7px 4px;font-size:11px;color:var(--ink3);vertical-align:top;">${_fmtMaster(p.fecha)}</td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>
    </div>`;
  }

  // ── Bloque 2: Hitos próximos (≤14 días, Excel) ───────────────
  if (hitosDedup.length) {
    function hitoDiasStr(dias) {
      if (dias === 0) return `<span style="color:#c00;font-weight:600;">hoy</span>`;
      if (dias === 1) return `<span style="color:#c00;font-weight:600;">mañana</span>`;
      if (dias <= 5)  return `<span style="color:#c00;font-weight:600;">${dias}d</span>`;
      if (dias <= 10) return `<span style="color:#b06000;font-weight:600;">${dias}d</span>`;
      return `<span style="color:var(--ink2);">${dias}d</span>`;
    }
    html += `<div id="ale-hitos" class="panel" style="background:var(--bg2);border-left:3px solid ${BORDE_PROX};">
      <div class="panel-head">
        <span class="eyebrow">HITOS PRÓXIMOS</span>
        <span style="font-size:11px;color:var(--ink3);font-weight:300;margin-left:6px;">próximos 14 días · ${hitosDedup.length}</span>
      </div>
      <div class="tbl-wrap"><table class="tbl" style="width:100%;">
        <thead><tr>
          <th style="width:24%;">Proyecto</th>
          <th style="width:20%;">Hito</th>
          <th style="width:28%;">Fecha prevista</th>
          <th style="width:14%;">Faltan</th>
          <th style="width:14%;">Tu presencia</th>
        </tr></thead>
        <tbody>${hitosDedup.map(h => `<tr style="border-top:1px solid var(--rule);">
          <td style="padding:5px 4px 5px 0;font-size:12px;font-weight:500;vertical-align:top;">${h.nombre||'—'}<br>
            <span style="font-size:10px;color:var(--ink3);font-weight:400;">${h.dept||''}</span></td>
          <td style="padding:5px 4px;font-size:11px;color:var(--ink2);vertical-align:top;">${h.label}</td>
          <td style="padding:5px 4px;font-size:11.5px;vertical-align:top;">${_fmtMaster(h.valor)}</td>
          <td style="padding:5px 4px;vertical-align:top;">${hitoDiasStr(h.dias)}</td>
          <td style="padding:5px 0 5px 4px;font-size:10px;vertical-align:top;">${(h.intervencion_ale||'').toLowerCase()==='sí'||h.intervencion_ale==='si'?'<span style="color:#8b3a00;font-weight:600;">Requerida</span>':'<span style="color:var(--ink3);">—</span>'}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>`;
  }

  // ── Bloque 3: Alertas escaladas por PM (JSON) ─────────────────
  if (alertasEscaladas.length) {
    function intRowAle(i) {
      const tipoColor = {Decisión:'#c00',Aprobación:'#b06000',Reunión:'#005f9e',Negociación:'#600060',Supervisión:'#444'}[i.tipo]||'#444';
      const dias = diasRestantes(i.fecha_limite);
      const diasStr = dias === null ? '—'
        : dias < 0 ? `<span style="color:#c00;font-weight:600;">vencida +${Math.abs(dias)}d</span>`
        : dias === 0 ? `<span style="color:#c00;font-weight:600;">hoy</span>`
        : dias <= 2 ? `<span style="color:#c00;font-weight:600;">${dias}d</span>`
        : `${dias}d`;
      return `<tr style="border-top:1px solid var(--rule);">
        <td style="padding:6px 4px 6px 0;font-size:12px;font-weight:500;vertical-align:top;">${i.proyecto||'—'}<br>
          <span style="font-size:10px;color:var(--ink3);font-weight:400;">${i.departamento||''}</span></td>
        <td style="padding:6px 4px;vertical-align:top;"><span style="font-size:10px;font-weight:600;color:${tipoColor};">${i.tipo||'—'}</span></td>
        <td style="padding:6px 4px;font-size:11.5px;color:var(--ink2);vertical-align:top;">${i.accion_concreta||'—'}</td>
        <td style="padding:6px 4px;font-size:11px;color:var(--ink2);vertical-align:top;">${i.impacto_si_no_actua||'—'}</td>
        <td style="padding:6px 0 6px 4px;font-size:11px;white-space:nowrap;vertical-align:top;">${fmtFecha(i.fecha_limite)}<br><span style="font-size:10px;">(${diasStr})</span></td>
      </tr>`;
    }
    html += `<div id="ale-alertas" class="panel" style="background:${BG_ALERTA};border-left:3px solid #8b0000;">
      <div class="panel-head">
        <span class="eyebrow" style="color:#8b0000;">● ALERTAS · JAVIER ESCALA</span>
        <span style="font-size:11px;color:var(--ink3);font-weight:300;margin-left:6px;">${alertasEscaladas.length} · ciclo ${sem}</span>
      </div>
      <div class="tbl-wrap"><table class="tbl" style="width:100%;">
        <thead><tr>
          <th style="width:18%;">Proyecto</th><th style="width:11%;">Tipo</th>
          <th style="width:31%;">Qué se necesita</th><th style="width:28%;">Impacto si no actúas</th>
          <th style="width:12%;">Límite</th>
        </tr></thead>
        <tbody>${alertasEscaladas.map(intRowAle).join('')}</tbody>
      </table></div>
    </div>`;
  } else if (cicloValido) {
    // Ciclo publicado pero sin alertas escaladas esta semana
    html += `<div id="ale-alertas" class="panel" style="background:var(--bg2);border-left:3px solid var(--rule);">
      <div class="panel-head"><span class="eyebrow">ALERTAS · JAVIER ESCALA</span></div>
      <p class="panel-note" style="padding:10px 0;">Sin alertas escaladas esta semana.</p>
    </div>`;
  }
  // Si no hay ciclo válido, no se muestra el bloque de alertas JSON (no hay nada que mostrar).

  // ── Bloque 4: Resueltas recientemente (JSON) ──────────────────
  if (intResueltas.length) {
    html += `<div id="ale-resueltas" class="panel" style="background:var(--bg2);border-left:3px solid #2a7a2a;">
      <div class="panel-head"><span class="eyebrow" style="color:#2a7a2a;">RESUELTAS RECIENTEMENTE</span></div>
      <div class="tbl-wrap"><table class="tbl" style="width:100%;">
        <thead><tr><th>Proyecto</th><th>Decisión adoptada</th><th>Ejecuta</th><th>Fecha</th></tr></thead>
        <tbody>${intResueltas.map(i => `<tr style="border-top:1px solid var(--rule);">
          <td style="padding:5px 4px 5px 0;font-size:12px;">${i.proyecto||'—'}</td>
          <td style="padding:5px 4px;font-size:11px;color:var(--ink2);">${i.decision_adoptada||'—'}</td>
          <td style="padding:5px 4px;font-size:11px;color:var(--ink2);">${i.responsable_ejecucion||'—'}</td>
          <td style="padding:5px 0 5px 4px;font-size:11px;color:var(--ink3);">${fmtFecha(i.fecha_resolucion)}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>`;
  }

  // ── Bloque ausencias con impacto (modo Alejandra) ────────────
  const ausHtmlAle = renderAusenciasPendientes(true);
  if (ausHtmlAle) html += ausHtmlAle;

  // ── Estado vacío ──────────────────────────────────────────────
  if (!conIntervencion.length && !hitosDedup.length && !alertasEscaladas.length && !intResueltas.length && !ausHtmlAle) {
    html += `<div class="panel" style="background:var(--bg2);border-left:3px solid var(--rule);">
      <p class="panel-note" style="padding:16px 0;">Sin intervenciones ni hitos próximos registrados.</p>
    </div>`;
  }

  document.getElementById('view').innerHTML = html;
}

/* ── Helpers — ciclo semanal ─────────────────────────────── */
function diasRestantes(fechaLimite) {
  if (!fechaLimite) return null;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const lim = new Date(fechaLimite); lim.setHours(0,0,0,0);
  return Math.round((lim - hoy) / 86400000);
}

function fmtFecha(iso) {
  if (!iso) return '—';
  const [y,m,d] = iso.split('-');
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${parseInt(d)} ${meses[parseInt(m)-1]}`;
}

function prioTag(p) {
  if (p === 'Alta')   return `<span style="color:#c00;font-size:10px;font-weight:600;text-transform:uppercase;">Alta</span>`;
  if (p === 'Media')  return `<span style="color:#b06000;font-size:10px;font-weight:600;text-transform:uppercase;">Media</span>`;
  return `<span style="color:var(--ink3);font-size:10px;">Baja</span>`;
}

function estadoObjTag(e) {
  const m = {Pendiente:'#666',Completado:'#2a7a2a',Bloqueado:'#c00',Arrastrado:'#b06000','En curso':'#005f9e'};
  return `<span style="color:${m[e]||'#666'};font-size:10px;font-weight:600;">${e||'—'}</span>`;
}

/* Render secciones ciclo semanal PM */
function renderCicloSemanalJavi() {
  const obj   = (typeof OBJETIVOS_SEMANA !== 'undefined') ? OBJETIVOS_SEMANA : null;
  const int_d = (typeof INTERVENCIONES_DIR !== 'undefined') ? INTERVENCIONES_DIR : null;
  const hoy   = new Date(); hoy.setHours(0,0,0,0);

  let html = '';

  /* ── 1. ESTA SEMANA — objetivos publicados ─────────────────── */
  const objetivos = (obj && obj.objetivos) ? obj.objetivos : [];
  if (objetivos.length) {
    // Agrupar por departamento
    const porDpto = {};
    objetivos.forEach(o => {
      const d = o.departamento || 'General';
      if (!porDpto[d]) porDpto[d] = [];
      porDpto[d].push(o);
    });
    // Ordenar cada grupo: Alta primero, luego por fecha_limite
    Object.values(porDpto).forEach(arr => arr.sort((a,b) => {
      const pp = {Alta:0,Media:1,Baja:2};
      if ((pp[a.prioridad]||1) !== (pp[b.prioridad]||1)) return (pp[a.prioridad]||1)-(pp[b.prioridad]||1);
      return (a.fecha_limite||'').localeCompare(b.fecha_limite||'');
    }));

    let filas = '';
    const deptos = ['Vivienda','Restaurantes','Hoteles','General'];
    deptos.forEach(d => {
      if (!porDpto[d]) return;
      filas += `<tr><td colspan="5" style="padding:6px 0 2px;font-size:10px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;">${d}</td></tr>`;
      porDpto[d].forEach(o => {
        const dias = diasRestantes(o.fecha_limite);
        const diasStr = dias === null ? '—' : dias < 0 ? `<span style="color:#c00">+${Math.abs(dias)}d</span>` : dias <= 2 ? `<span style="color:#c00">${dias}d</span>` : `${dias}d`;
        const arrastradoBadge = o.semanas_arrastrado > 0
          ? `<span style="color:#b06000;font-size:9px;margin-left:4px;">↩ ×${o.semanas_arrastrado}</span>` : '';
        filas += `<tr style="border-top:1px solid var(--rule);">
          <td style="padding:5px 4px 5px 0;font-size:12px;">${o.proyecto||'—'}${arrastradoBadge}</td>
          <td style="padding:5px 4px;font-size:11.5px;color:var(--ink2);">${o.responsable||'—'}</td>
          <td style="padding:5px 4px;">${prioTag(o.prioridad)}</td>
          <td style="padding:5px 4px;font-size:11px;color:var(--ink2);">${fmtFecha(o.fecha_limite)}&nbsp;(${diasStr})</td>
          <td style="padding:5px 0 5px 4px;">${estadoObjTag(o.estado)}</td>
        </tr>
        <tr><td colspan="5" style="padding:0 0 6px;font-size:11px;color:var(--ink2);">${o.descripcion||''}</td></tr>`;
      });
    });

    html += `<div id="pm-esta-semana" class="panel" style="background:${BG_SEMANA};border-left:3px solid ${BORDE_SEMANA};">
      <div class="panel-head"><span class="eyebrow">ESTA SEMANA</span>
        <span style="font-size:11px;color:var(--ink3);font-weight:300;margin-left:6px;">${obj.semana||''} · ${objetivos.length} objetivo${objetivos.length!==1?'s':''}</span>
      </div>
      <div class="tbl-wrap"><table class="tbl" style="width:100%;">
        <thead><tr>
          <th style="width:28%;">Proyecto</th><th style="width:14%;">Resp.</th>
          <th style="width:10%;">Prio</th><th style="width:18%;">Límite</th><th style="width:14%;">Estado</th>
        </tr></thead>
        <tbody>${filas}</tbody>
      </table></div>
    </div>`;
  }

  /* ── 2. INTERVENCIONES PENDIENTES DIRECCIÓN ────────────────── */
  const intervenciones = (int_d && int_d.intervenciones) ? int_d.intervenciones : [];
  const pendientes = intervenciones.filter(i => i.estado === 'Pendiente' || i.estado === 'En revisión');
  if (pendientes.length) {
    const filas = pendientes.map(i => {
      const dias = diasRestantes(i.fecha_limite);
      const diasStr = dias === null ? '—' : dias < 0 ? `<span style="color:#c00;font-weight:600;">VENCIDA +${Math.abs(dias)}d</span>` : dias <= 2 ? `<span style="color:#c00;font-weight:600;">${dias}d</span>` : `${dias}d`;
      const tipoColor = {Decisión:'#c00',Aprobación:'#b06000',Reunión:'#005f9e',Negociación:'#600060',Supervisión:'#444'}[i.tipo]||'#444';
      return `<tr style="border-top:1px solid var(--rule);">
        <td style="padding:5px 4px 5px 0;font-size:12px;">${i.proyecto||'—'}</td>
        <td style="padding:5px 4px;"><span style="font-size:10px;font-weight:600;color:${tipoColor};">${i.tipo||'—'}</span></td>
        <td style="padding:5px 4px;font-size:11px;color:var(--ink2);">${i.accion_concreta||'—'}</td>
        <td style="padding:5px 0 5px 4px;font-size:11px;">${fmtFecha(i.fecha_limite)}&nbsp;(${diasStr})</td>
      </tr>`;
    }).join('');

    html += `<div id="pm-intervenciones" class="panel" style="background:var(--bg2);border-left:3px solid #8b0000;">
      <div class="panel-head"><span class="eyebrow" style="color:#8b0000;">INTERVENCIONES · DIRECCIÓN</span>
        <span style="font-size:11px;color:var(--ink3);font-weight:300;margin-left:6px;">${pendientes.length} pendiente${pendientes.length!==1?'s':''}</span>
      </div>
      <div class="tbl-wrap"><table class="tbl" style="width:100%;">
        <thead><tr>
          <th style="width:22%;">Proyecto</th><th style="width:14%;">Tipo</th>
          <th style="width:44%;">Acción requerida</th><th style="width:20%;">Límite</th>
        </tr></thead>
        <tbody>${filas}</tbody>
      </table></div>
    </div>`;
  }

  /* ── 3. INTERVENCIONES RESUELTAS — REVISAR OBJETIVO ───────── */
  const objIds = new Set(objetivos.map(o => o.id));
  // También incluir bloqueados del historial reciente
  const todosBloqueados = new Set();
  (obj && obj.objetivos ? obj.objetivos : []).forEach(o => {
    if (o.estado === 'Bloqueado') todosBloqueados.add(o.id);
  });
  (obj && obj.historial ? obj.historial : []).forEach(sem => {
    (sem.objetivos||[]).forEach(o => { if (o.estado_final === 'Bloqueado') todosBloqueados.add(o.id); });
  });

  const resueltasRevisar = intervenciones.filter(i =>
    i.estado === 'Resuelta' && i.objetivo_vinculado_id && todosBloqueados.has(i.objetivo_vinculado_id)
  );
  if (resueltasRevisar.length) {
    const filas = resueltasRevisar.map(i =>
      `<tr style="border-top:1px solid var(--rule);">
        <td style="padding:5px 4px 5px 0;font-size:12px;">${i.proyecto||'—'}</td>
        <td style="padding:5px 4px;font-size:11px;color:#2a7a2a;font-weight:600;">Resuelta</td>
        <td style="padding:5px 4px;font-size:11px;color:var(--ink2);">${i.decision_adoptada||'—'}</td>
        <td style="padding:5px 0 5px 4px;font-size:11px;color:#c00;">Obj. ${i.objetivo_vinculado_id} — Bloqueado</td>
      </tr>`
    ).join('');
    html += `<div id="pm-revisar" class="panel" style="background:var(--bg2);border-left:3px solid #b06000;">
      <div class="panel-head"><span class="eyebrow" style="color:#b06000;">INTERVENCIÓN RESUELTA — REVISAR OBJETIVO</span></div>
      <div class="tbl-wrap"><table class="tbl" style="width:100%;">
        <thead><tr><th>Proyecto</th><th>Estado int.</th><th>Decisión adoptada</th><th>Objetivo</th></tr></thead>
        <tbody>${filas}</tbody>
      </table></div>
    </div>`;
  }

  /* ── 4. BLOQUEADOS SIN INTERVENCIÓN ───────────────────────── */
  // Objetivos en estado Bloqueado que NO tienen ninguna intervención vinculada activa
  const intIdsBloqueados = new Set(
    intervenciones
      .filter(i => i.estado !== 'Resuelta' && i.estado !== 'Descartada' && i.objetivo_vinculado_id)
      .map(i => i.objetivo_vinculado_id)
  );
  const bloqueadosSinInt = objetivos.filter(o =>
    o.estado === 'Bloqueado' && !intIdsBloqueados.has(o.id)
  );
  if (bloqueadosSinInt.length) {
    const filas = bloqueadosSinInt.map(o => {
      const dias = diasRestantes(o.fecha_limite);
      const diasStr = dias === null ? '—' : dias < 0 ? `<span style="color:#c00;font-weight:600;">+${Math.abs(dias)}d</span>` : dias <= 2 ? `<span style="color:#c00;font-weight:600;">${dias}d</span>` : `${dias}d`;
      return `<tr style="border-top:1px solid var(--rule);">
        <td style="padding:5px 4px 5px 0;font-size:12px;font-weight:500;">${o.proyecto||'—'}</td>
        <td style="padding:5px 4px;font-size:11px;color:var(--ink2);">${o.responsable||'—'}</td>
        <td style="padding:5px 4px;">${prioTag(o.prioridad)}</td>
        <td style="padding:5px 4px;font-size:11px;color:var(--ink2);">${fmtFecha(o.fecha_limite)}&nbsp;(${diasStr})</td>
        <td style="padding:5px 4px;font-size:11px;color:var(--ink2);max-width:200px;">${o.descripcion||'—'}</td>
      </tr>`;
    }).join('');
    html += `<div id="pm-bloqueados" class="panel" style="background:${BG_ALERTA};border-left:3px solid #8b0000;">
      <div class="panel-head">
        <span class="eyebrow" style="color:#8b0000;">● BLOQUEADOS SIN INTERVENCIÓN</span>
        <span style="font-size:11px;color:var(--ink3);font-weight:300;margin-left:6px;">${bloqueadosSinInt.length} objetivo${bloqueadosSinInt.length!==1?'s':''} · escalar a Dirección</span>
      </div>
      <div class="tbl-wrap"><table class="tbl" style="width:100%;">
        <thead><tr>
          <th style="width:22%;">Proyecto</th><th style="width:14%;">Responsable</th>
          <th style="width:10%;">Prio</th><th style="width:16%;">Límite</th><th style="width:38%;">Objetivo</th>
        </tr></thead>
        <tbody>${filas}</tbody>
      </table></div>
    </div>`;
  }

  /* ── 5. ARRASTRADOS EN REVISIÓN (> 2 semanas) ──────────────── */
  const arrastrados = objetivos.filter(o => (o.semanas_arrastrado||0) > 2);
  if (arrastrados.length) {
    const filas = arrastrados.map(o =>
      `<tr style="border-top:1px solid var(--rule);">
        <td style="padding:5px 4px 5px 0;font-size:12px;">${o.proyecto||'—'}</td>
        <td style="padding:5px 4px;font-size:11px;color:var(--ink2);">${o.responsable||'—'}</td>
        <td style="padding:5px 4px;font-size:11px;color:#b06000;font-weight:600;">${o.semanas_arrastrado} semanas</td>
        <td style="padding:5px 0 5px 4px;font-size:11px;color:var(--ink2);">${o.descripcion||'—'}</td>
      </tr>`
    ).join('');
    html += `<div id="pm-arrastrados" class="panel" style="background:var(--bg2);border-left:3px solid #b06000;">
      <div class="panel-head"><span class="eyebrow" style="color:#b06000;">ARRASTRADOS EN REVISIÓN</span>
        <span style="font-size:11px;color:var(--ink3);font-weight:300;margin-left:6px;">${arrastrados.length} objetivo${arrastrados.length!==1?'s':''} · más de 2 semanas</span>
      </div>
      <div class="tbl-wrap"><table class="tbl" style="width:100%;">
        <thead><tr><th>Proyecto</th><th>Responsable</th><th>Arrastrado</th><th>Objetivo</th></tr></thead>
        <tbody>${filas}</tbody>
      </table></div>
    </div>`;
  }

  return html;
}

/* ── AUSENCIAS — bloque compartido (Javi + Ale) ────────────── */
// modoAle: si true, filtra solo ausencias que afectan a proyectos con intervencion_ale
// o con hitos próximos (relevancia para la dirección)
function renderAusenciasPendientes(modoAle) {
  const aus = (typeof AUSENCIAS_EQUIPO !== 'undefined') ? (AUSENCIAS_EQUIPO || []) : [];
  if (!aus.length) return '';

  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const VENTANA_DIAS = 60; // mostrar ausencias en los próximos 60 días
  const master = (typeof MASTER_DATA !== 'undefined') ? (MASTER_DATA || []) : [];

  // Proyectos activos para el cruce (excluir PARADO/latente/pendiente sin equipo)
  // p.equipo es array de strings en MASTER_DATA
  const proyActivos = master.filter(p => {
    const at = (p.atencion||'').toUpperCase();
    if (at === 'PARADO') return false;
    const eq = p.equipo;
    if (!eq) return false;
    if (Array.isArray(eq)) return eq.length > 0;
    return eq.trim() !== '' && eq !== '—';
  });

  // Función para obtener proyectos de una persona por nombre en el array EQUIPO
  // MASTER_DATA.equipo es array de strings (nombres individuales), p.ej. ["Nela","Olatz"]
  function proyectosDe(nombre) {
    if (!nombre) return [];
    const n = nombre.toLowerCase().trim();
    return proyActivos.filter(p => {
      const eq = p.equipo;
      if (Array.isArray(eq)) {
        return eq.some(part => (part||'').toLowerCase().trim() === n);
      }
      // Fallback: string
      return (eq||'').toLowerCase().split(/[/,\s]+/).some(part => part.trim() === n);
    });
  }

  // Función: ¿tiene esta persona hitos relevantes durante su ausencia?
  // Devuelve array de {proyecto, label, fecha, dias} o []
  function hitosEnAusencia(proyPersona, iniStr, finStr) {
    if (!proyPersona.length) return [];
    const iniD = new Date(iniStr); iniD.setHours(0,0,0,0);
    const finD = new Date(finStr); finD.setHours(23,59,59,999);
    const hits = [];
    proyPersona.forEach(p => {
      const slots = [
        { label: 'Fin de obra',  valor: p.fin_obra },
        { label: 'Montaje',      valor: p.montaje  },
        { label: 'Entrega',      valor: p.entrega  },
        { label: p.hito||'Hito', valor: p.fecha,   },
      ];
      slots.forEach(sl => {
        if (!sl.valor || sl.valor === '—') return;
        const fd = _parseFechaMaster(sl.valor);
        if (!fd) return;
        fd.setHours(12,0,0,0);
        if (fd >= iniD && fd <= finD) {
          const diasDesdeHoy = Math.round((fd - hoy) / 86400000);
          hits.push({ proyecto: p.nombre, label: sl.label, fecha: sl.valor, dias: diasDesdeHoy });
        }
      });
    });
    return hits;
  }

  // Agrupar filas de AUSENCIAS por persona+bloque contiguo
  // Bizneo exporta multi-día como filas separadas; las agrupamos en periodos
  const grupos = {};
  aus.forEach(a => {
    const key = a.persona;
    if (!grupos[key]) grupos[key] = [];
    grupos[key].push(a);
  });

  // Para cada persona, construir periodos consolidados
  const periodos = [];
  Object.keys(grupos).forEach(persona => {
    const entradas = grupos[persona].sort((a, b) => a.inicio.localeCompare(b.inicio));
    // Merge entradas contiguas (Bizneo exporta un registro por día)
    const merged = [];
    entradas.forEach(e => {
      if (!merged.length) { merged.push({...e}); return; }
      const last = merged[merged.length-1];
      // Si el inicio de esta es igual o 1 día después del fin anterior, merge
      const lastFin = new Date(last.fin || last.inicio);
      const eIni    = new Date(e.inicio);
      const diff    = Math.round((eIni - lastFin) / 86400000);
      if (diff <= 1 && e.tipo === last.tipo) {
        last.fin = e.fin || e.inicio;
      } else {
        merged.push({...e});
      }
    });
    merged.forEach(m => {
      const finDate = new Date(m.fin || m.inicio); finDate.setHours(23,59,59,999);
      const iniDate = new Date(m.inicio); iniDate.setHours(0,0,0,0);
      const limite  = new Date(hoy.getTime() + VENTANA_DIAS * 86400000);
      // Filtrar: solo futuras o en curso dentro de la ventana
      if (finDate < hoy) return;
      if (iniDate > limite) return;
      periodos.push({ persona, inicio: m.inicio, fin: m.fin||m.inicio, tipo: m.tipo, esAdmin: m.estado === 'CONFIRMADA' && grupos[persona][0] });
    });
  });

  if (!periodos.length) return '';

  // Para cada periodo: calcular proyectos afectados y clasificar impacto
  const filas = [];
  periodos.forEach(per => {
    const proyPersona = proyectosDe(per.persona);
    const hits        = hitosEnAusencia(proyPersona, per.inicio, per.fin);

    // Clasificación
    let clasif = 'SIN_IMPACTO';
    if (hits.length > 0) {
      // Hay hito/entrega durante la ausencia → CONFLICTO
      clasif = 'CONFLICTO';
    } else if (proyPersona.length > 0) {
      // Tiene proyectos activos pero sin hito exacto en la ausencia → REVISAR
      clasif = 'REVISAR';
    }

    // En modo Alejandra: solo mostrar si CONFLICTO, o si algún proyecto tiene intervencion_ale
    if (modoAle) {
      const tieneAle = proyPersona.some(p =>
        (p.intervencion_ale||'').toLowerCase() === 'sí' ||
        (p.intervencion_ale||'').toLowerCase() === 'si'
      );
      if (clasif === 'SIN_IMPACTO' && !tieneAle) return;
    }

    // Duración en días laborables (aproximado: días naturales)
    const iniD = new Date(per.inicio);
    const finD = new Date(per.fin);
    const durDias = Math.max(1, Math.round((finD - iniD) / 86400000) + 1);

    // Días hasta inicio
    const diasHasta = Math.round((iniD - hoy) / 86400000);

    filas.push({ ...per, proyPersona, hits, clasif, durDias, diasHasta });
  });

  // Ordenar: CONFLICTO primero, luego REVISAR, luego por fecha inicio
  filas.sort((a, b) => {
    const o = {CONFLICTO:0, REVISAR:1, SIN_IMPACTO:2};
    const oc = (o[a.clasif]??2) - (o[b.clasif]??2);
    if (oc !== 0) return oc;
    return a.inicio.localeCompare(b.inicio);
  });

  if (!filas.length) return '';

  // Helpers de formato para ausencias
  function fmtAusDate(isoStr) {
    if (!isoStr) return '—';
    const [y,m,d] = isoStr.split('-');
    const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    return `${parseInt(d)} ${meses[parseInt(m)-1]}`;
  }

  function clasifBadge(c) {
    if (c === 'CONFLICTO')   return `<span style="font-size:9px;font-weight:700;color:#8b0000;text-transform:uppercase;letter-spacing:.4px;">● CONFLICTO</span>`;
    if (c === 'REVISAR')     return `<span style="font-size:9px;font-weight:700;color:#b06000;text-transform:uppercase;letter-spacing:.4px;">REVISAR</span>`;
    return `<span style="font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:.4px;">Sin impacto</span>`;
  }

  function hitosStr(hits) {
    if (!hits.length) return '—';
    return hits.map(h =>
      `<span style="color:${h.dias<=7?'#8b0000':'#b06000'};font-size:10.5px;">${h.proyecto} · ${h.label} (${fmtAusDate(h.fecha)})</span>`
    ).join('<br>');
  }

  const rows = filas.map(f => {
    const rangoStr = f.inicio === f.fin
      ? fmtAusDate(f.inicio)
      : `${fmtAusDate(f.inicio)}–${fmtAusDate(f.fin)}`;
    const durStr = f.durDias === 1 ? '1 día' : `${f.durDias} días`;
    const proyStr = f.proyPersona.length
      ? f.proyPersona.map(p => p.nombre).join(', ')
      : '—';
    const diasStr = f.diasHasta <= 0
      ? `<span style="color:#c00;font-weight:600;">En curso</span>`
      : f.diasHasta <= 7
        ? `<span style="color:#c00;font-weight:600;">${f.diasHasta}d</span>`
        : `<span style="color:var(--ink2);">${f.diasHasta}d</span>`;
    return `<tr style="border-top:1px solid var(--rule);">
      <td style="padding:6px 4px 6px 0;font-size:12px;font-weight:500;vertical-align:top;">${f.persona}</td>
      <td style="padding:6px 4px;font-size:11px;color:var(--ink3);vertical-align:top;">${rangoStr}<br><span style="font-size:10px;">${durStr}</span></td>
      <td style="padding:6px 4px;vertical-align:top;">${diasStr}</td>
      <td style="padding:6px 4px;vertical-align:top;">${clasifBadge(f.clasif)}</td>
      <td style="padding:6px 4px;font-size:10.5px;color:var(--ink2);vertical-align:top;">${hitosStr(f.hits)}</td>
      <td style="padding:6px 0 6px 4px;font-size:10px;color:var(--ink3);vertical-align:top;">${modoAle ? '' : f.proyPersona.length + ' proy.'}<br style="${modoAle?'display:none':''}"><span style="font-size:9.5px;${modoAle?'display:none':''}">${proyStr.length > 60 ? proyStr.slice(0,57)+'…' : proyStr}</span></td>
    </tr>`;
  });

  const tituloBloque = modoAle ? 'AUSENCIAS CON IMPACTO' : 'PRÓXIMAS AUSENCIAS Y COBERTURAS';
  const conflictos = filas.filter(f => f.clasif === 'CONFLICTO').length;
  const revisar    = filas.filter(f => f.clasif === 'REVISAR').length;
  const subNote = [
    conflictos ? `${conflictos} conflicto${conflictos!==1?'s':''}` : '',
    revisar    ? `${revisar} a revisar` : '',
  ].filter(Boolean).join(' · ') || `${filas.length} próxima${filas.length!==1?'s':''}`;

  const colsHead = modoAle
    ? `<th style="width:14%;">Persona</th><th style="width:16%;">Periodo</th><th style="width:9%;">Faltan</th><th style="width:14%;">Impacto</th><th style="width:47%;">Entregas/hitos durante ausencia</th>`
    : `<th style="width:12%;">Persona</th><th style="width:14%;">Periodo</th><th style="width:8%;">Faltan</th><th style="width:12%;">Impacto</th><th style="width:30%;">Hitos durante ausencia</th><th style="width:24%;">Proyectos asignados</th>`;

  const bordColor = conflictos > 0 ? '#8b0000' : '#b06000';

  return `<div id="bloque-ausencias" class="panel" style="background:var(--bg2);border-left:3px solid ${bordColor};">
    <div class="panel-head">
      <span class="eyebrow" style="color:${bordColor};">${tituloBloque}</span>
      <span style="font-size:11px;color:var(--ink3);font-weight:300;margin-left:6px;">${subNote} · próximos 60 días</span>
    </div>
    <div class="tbl-wrap"><table class="tbl" style="width:100%;">
      <thead><tr>${colsHead}</tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table></div>
  </div>`;
}

/* ── Render Javi — CENTRO DE CONTROL ──────────────────────── */
function renderJavi() {
  const todos = (MASTER_DATA||[]).map(enrich);
  const sem   = hoySemana();

  const GRUPOS = [
    { level:0, id:'javi-alerta',     label:'● ALERTA',        cls:'tag-crit', bg:BG_ALERTA,     borde:BORDE_ALERTA,    withGantt:true  },
    { level:1, id:'javi-atencion',   label:'● ATENCIÓN',      cls:'tag-alto', bg:BG_ATENCION,   borde:BORDE_ATENCION,  withGantt:true  },
    { level:2, id:'javi-info',       label:'● INFO FALTANTE', cls:'tag-med',  bg:BG_INFO,       borde:BORDE_INFO,      withGantt:false },
    { level:3, id:'javi-controlado', label:'● CONTROLADO',    cls:'tag-baj',  bg:BG_CONTROLADO, borde:BORDE_CONTROLADO,withGantt:false },
  ];

  GRUPOS.forEach(g => { g.projs = todos.filter(p => atLevel(p) === g.level); });

  // Pre-calcular si habrá bloque de ausencias para el índice
  const _ausJaviLen = (() => {
    const aus = (typeof AUSENCIAS_EQUIPO !== 'undefined') ? (AUSENCIAS_EQUIPO || []) : [];
    const hoyTmp = new Date(); hoyTmp.setHours(0,0,0,0);
    const limite = new Date(hoyTmp.getTime() + 60 * 86400000);
    return aus.filter(a => {
      const fin = new Date(a.fin||a.inicio); fin.setHours(23,59,59,999);
      const ini = new Date(a.inicio); ini.setHours(0,0,0,0);
      return fin >= hoyTmp && ini <= limite;
    }).length;
  })();

  const indiceHtml = `
    <div class="idx-nav" style="margin-bottom:20px;">
      ${GRUPOS.map(g => indexBtn(g.id, g.label, g.bg, g.borde, g.projs.length)).join('')}
      ${_ausJaviLen ? indexBtn('bloque-ausencias', 'AUSENCIAS', 'var(--bg2)', '#b06000', _ausJaviLen) : ''}
    </div>`;

  let html = `<div class="view-head">
    <div>
      <div class="view-title">CENTRO DE CONTROL</div>
      <div class="view-sub">${sem} · ${todos.length} proyectos</div>
    </div>
  </div>
  ${indiceHtml}`;

  /* Secciones del ciclo semanal — antes de los grupos de estado */
  html += renderCicloSemanalJavi();

  GRUPOS.forEach(g => {
    if (!g.projs.length) return;
    html += `<div id="${g.id}" class="panel" style="background:${g.bg};border-left:3px solid ${g.borde};">
      <div class="panel-head">
        <span class="eyebrow">${tagHtml(g.cls, g.label)}&ensp;<span style="font-weight:300;color:var(--ink3);">${g.projs.length}</span></span>
      </div>
      ${g.projs.map(p => projCard(p, {gantt: g.withGantt})).join('')}
    </div>`;
  });

  /* Bloque de ausencias — al final del centro de control */
  const ausHtml = renderAusenciasPendientes(false);
  if (ausHtml) html += ausHtml;

  document.getElementById('view').innerHTML = html;
}

/* ── Render Persona ──────────────────────────────────────── */
function renderPersona(nombre) {
  const todos = (MASTER_DATA||[]).filter(p => (p.equipo||[]).includes(nombre)).map(enrich);
  const sem   = hoySemana();

  const prioridad      = todos.filter(p => atLevel(p) <= 1).sort((a,b) => atLevel(a)-atLevel(b));
  const prioIds        = new Set(prioridad.map(p => p.id));
  const estaSemana     = todos.filter(p => !prioIds.has(p.id) && projHasActivityThisWeek(p));
  const estaIds        = new Set(estaSemana.map(p => p.id));
  const otrosProyectos = todos.filter(p => !prioIds.has(p.id) && !estaIds.has(p.id));

  const indiceHtml = `
    <div class="idx-nav" style="margin-bottom:20px;">
      ${indexBtn('sec-PRIORIDAD',       '● PRIORIDAD',       BG_ALERTA,   BORDE_ALERTA,   prioridad.length)}
      ${indexBtn('sec-ESTA-SEMANA',     'ESTA SEMANA',       BG_SEMANA,   BORDE_SEMANA,   estaSemana.length)}
      ${indexBtn('sec-OTROS-PROYECTOS', 'OTROS PROYECTOS',   BG_OTROS,    BORDE_OTROS,    otrosProyectos.length)}
    </div>`;

  let html = `<div class="view-head">
    <div>
      <div class="view-title">${nombre}</div>
      <div class="view-sub">${todos.length} proyecto${todos.length!==1?'s':''}</div>
    </div>
  </div>
  ${indiceHtml}`;

  if (prioridad.length) {
    html += `<div id="sec-PRIORIDAD" class="panel" style="background:${BG_ALERTA};border-left:3px solid ${BORDE_ALERTA};">
      <div class="panel-head">${tagHtml('tag-crit','● PRIORIDAD')}&ensp;<span style="font-weight:300;color:var(--ink3);">${prioridad.length}</span></div>
      ${prioridad.map(p => projCard(p, {gantt:true})).join('')}
    </div>`;
  }

  if (estaSemana.length) {
    html += `<div id="sec-ESTA-SEMANA" class="panel" style="background:${BG_SEMANA};border-left:3px solid ${BORDE_SEMANA};">
      <div class="panel-head"><span class="eyebrow">ESTA SEMANA · ${sem}</span></div>
      ${estaSemana.map(p => projCard(p, {gantt:true})).join('')}
    </div>`;
  }

  if (otrosProyectos.length) {
    html += `<div id="sec-OTROS-PROYECTOS" class="panel" style="background:${BG_OTROS};border-left:3px solid ${BORDE_OTROS};">
      <div class="panel-head"><span class="eyebrow">OTROS PROYECTOS · ${otrosProyectos.length}</span></div>
      ${otrosProyectos.map(p => projCard(p, {gantt:true})).join('')}
    </div>`;
  }

  if (!todos.length) {
    html += '<p class="panel-note" style="margin-top:20px;">Sin proyectos asignados.</p>';
  }

  document.getElementById('view').innerHTML = html;
}

/* ── Exportar ─────────────────────────────────────────────── */
function exportar() {
  const hoy  = new Date().toLocaleDateString('es-ES');
  const sem  = hoySemana();
  const lines = [`POMBO ESTUDIO — ${hoy} (${sem})`, '='.repeat(50), ''];

  ['VIVIENDA','RESTAURANTES','HOTELES'].forEach(dpto => {
    const ps = (MASTER_DATA||[]).filter(p => (p.dpto||'').toUpperCase().includes(dpto.slice(0,-1)||dpto));
    if (!ps.length) return;
    lines.push(`\n── ${dpto} (${ps.length}) ──`);
    ps.forEach(p => {
      const g = globalOf(p.id);
      lines.push(`  ${p.nombre}`);
      if (g?.atencion)     lines.push(`    ${g.atencion}`);
      if (g?.proximo_hito) lines.push(`    → ${g.proximo_hito}${g.fecha_hito?' ('+g.fecha_hito+')':''}`);
      if (g?.bloqueador)   lines.push(`    ⚠ ${g.bloqueador}`);
    });
  });

  const blob = new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8'});
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = `pombo_${(sem||'export').replace('/','_')}.txt`;
  a.click();
}

      font-size:10.5px;font-weight:600;letter-spacing:.07em;

/* ── Eventos ──────────────────────────────────────────────── */
function wireEvents() {
  document.getElementById('tabs')?.addEventListener('click', e => {
    const b = e.target.closest('.tab');
    if (b) activateTab(b.dataset.tab);
  });

  document.getElementById('view')?.addEventListener('click', e => {
    const open = e.target.closest('[data-open]');
    if (open) { openModal(open.dataset.open); return; }
  });

  document.getElementById('export-btn')?.addEventListener('click', exportar);
  document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });
}

/* ── Init ─────────────────────────────────────────────────── */
function init() {
  injectStyles();
  buildIndexes();
  buildTabs();
  wireEvents();
  activateTab('alejandra');  // Alejandra es la pestaña inicial

  // week-badge → fecha actual del sistema (dinámica, calculada en el cliente)
  const wb = document.getElementById('week-badge');
  if (wb) {
    const ahora = new Date();
    const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    wb.textContent = `Hoy: ${ahora.getDate()} ${meses[ahora.getMonth()]} ${ahora.getFullYear()}`;
  }

  // update-badge → fecha de modificación del Excel (estática, viene de META)
  const ub = document.getElementById('update-badge');
  if (ub && META?.updated) ub.textContent = 'Datos: ' + META.updated;
}

// ── RENDERS · VISUALIZACIÓN ──────────────────────────────────────────────────
function renderVisualizacion() {
  const el = document.getElementById('content');
  if (!el) return;

  const data = (typeof VISUALIZACION_DATA !== 'undefined') ? (VISUALIZACION_DATA || []) : [];

  // Separar por colaborador (un proyecto puede aparecer en varias secciones)
  function proysByColaborador(nombre) {
    return data.filter(p => {
      const v = (p.visualizacion || '').toLowerCase();
      return v.includes(nombre.toLowerCase());
    });
  }

  const challan = proysByColaborador('challan');
  const pancho  = proysByColaborador('pancho');
  const mauro   = proysByColaborador('mauro');

  const totalUnico = data.length;

  function renderSection(titulo, proyectos, color, icono) {
    if (!proyectos.length) return `
      <div class="panel" style="background:var(--bg2);border-left:3px solid ${color};opacity:.5;">
        <div class="panel-head">
          <span class="eyebrow" style="color:${color};">${icono} ${titulo}</span>
          <span style="font-size:11px;color:var(--ink3);font-weight:300;margin-left:6px;">sin proyectos asignados</span>
        </div>
      </div>`;

    return `<div class="panel" style="background:var(--bg2);border-left:3px solid ${color};">
      <div class="panel-head">
        <span class="eyebrow" style="color:${color};">${icono} ${titulo}</span>
        <span style="font-size:11px;color:var(--ink3);font-weight:300;margin-left:6px;">${proyectos.length} proyecto${proyectos.length!==1?'s':''}</span>
      </div>
      <div class="tbl-wrap"><table class="tbl" style="width:100%;">
        <thead><tr>
          <th style="width:24%;">Proyecto</th>
          <th style="width:14%;">Depto</th>
          <th style="width:28%;">Visualización</th>
          <th style="width:34%;">Próximo hito</th>
        </tr></thead>
        <tbody>${proyectos.map(p => `<tr style="border-top:1px solid var(--rule);">
          <td style="padding:7px 4px 7px 0;font-size:12px;font-weight:500;vertical-align:top;">${p.nombre||'—'}</td>
          <td style="padding:7px 4px;font-size:11px;color:var(--ink3);vertical-align:top;">${p.dept||'—'}</td>
          <td style="padding:7px 4px;font-size:11.5px;vertical-align:top;">${p.visualizacion||'—'}</td>
          <td style="padding:7px 0 7px 4px;font-size:11px;color:var(--ink2);vertical-align:top;">${p.hito||'—'}<br>
            <span style="font-size:10px;color:var(--ink3);">${_fmtMaster(p.fecha)}</span></td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>`;
  }

  let html = `<div class="view-head">
    <div>
      <div class="view-title">RENDERS · VISUALIZACIÓN</div>
      <div class="view-sub">${totalUnico} proyecto${totalUnico!==1?'s':''} con visualización asignada · Challan ${challan.length} · Pancho ${pancho.length} · Mauro ${mauro.length}</div>
    </div>
  </div>`;

  if (!totalUnico) {
    html += `<div class="panel" style="background:var(--bg2);padding:24px;text-align:center;color:var(--ink3);font-size:13px;">
      Ningún proyecto tiene visualización asignada en el Master.<br>
      <span style="font-size:11px;">Rellena la columna VISUALIZACIÓN en el Excel para ver los proyectos aquí.</span>
    </div>`;
  } else {
    html += renderSection('CHALLAN — Renders externos', challan, '#3a5a8b', '📐');
    html += renderSection('PANCHO — Renders externos',  pancho,  '#5a3a8b', '📐');
    html += renderSection('MAURO — 3D · IA · Renders',  mauro,   '#2a7a5a', '🖥');
  }

  el.innerHTML = html;
}

document.addEventListener('DOMContentLoaded', init);
