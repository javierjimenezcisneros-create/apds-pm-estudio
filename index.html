<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APDS · PM Estudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --paper:#F4F1EC; --paper2:#EDE8E0; --surface:#FFF;
  --ink:#1A1410; --ink2:#5C5248; --ink3:#9C9088; --line:#DDD6CC;
  --burg:#3C1F21; --burg2:#5A3134; --burg3:#7A4548;
  --cop:#C26942; --cop2:#D4845A; --cop3:rgba(194,105,66,.15);
  --viv:#3D6491; --viv-t:#E4ECF5;
  --hot:#436B3A; --hot-t:#E3EDE0;
  --rest:#B35D30; --rest-t:#F5E4D8;
  --crit:#A82E2E; --crit-t:#F4DEDE;
  --alto:#B86328; --alto-t:#F4E4D6;
  --med:#967A1E; --med-t:#F0EAD2;
  --baj:#4E7A42; --baj-t:#DFF0D8;
  --vac:#7A736B; --vac-t:#EDEAE5;
  --ph1:#8A96BB; --ph2:#C0825A; --ph3:#C8A84E;
  --ph4:#6A9E90; --ph5:#7AA4CC; --ph6:#72A86C;
  --ph7:#B87EA8; --ph8:#B84040; --ph9:#C4BDB4;
  --r:3px; --f:'Inter','Helvetica Neue',Arial,sans-serif;
}
html,body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}

/* ── TOP BAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;background:var(--burg);gap:16px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:16px;}
.brand-name{font-size:12px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--cop);line-height:1.4;}
.brand-name span{display:block;}
.brand-div{width:1px;height:28px;background:var(--burg3);}
.brand-sub{font-size:10.5px;font-weight:300;letter-spacing:.12em;text-transform:uppercase;color:rgba(194,105,66,.6);}
.week-badge{font-size:10px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--cop);border:1px solid var(--burg3);padding:5px 12px;border-radius:2px;}
.update-badge{font-size:10px;color:rgba(194,105,66,.5);letter-spacing:.06em;}

/* ── TABS ── */
.tabs{display:flex;gap:0;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--line);padding:0 20px;flex-wrap:nowrap;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{font-size:11px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;padding:12px 18px;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--ink3);cursor:pointer;white-space:nowrap;transition:.15s;margin-bottom:-1px;}
.tab:hover{color:var(--ink);border-bottom-color:var(--line);}
.tab.active{color:var(--burg);border-bottom-color:var(--cop);font-weight:500;}
.tab.tab-master{color:var(--cop2);}
.tab.tab-master.active{color:var(--burg);}

/* ── LAYOUT ── */
.app{max-width:1020px;margin:0 auto;padding:0 20px 80px;}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:10px;margin:28px 0 24px;padding-bottom:16px;border-bottom:1px solid var(--line);}
.view-title{font-size:22px;font-weight:300;letter-spacing:.06em;text-transform:uppercase;color:var(--burg);}
.view-sub{font-size:11px;font-weight:300;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-top:5px;}
.view-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}

/* ── PANELS ── */
.panel{margin-bottom:24px;}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.eyebrow{font-size:10.5px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);}
.eyebrow::after{content:'';display:inline-block;height:1px;width:60px;background:var(--line);margin-left:10px;vertical-align:middle;}
.panel-note{font-size:11px;color:var(--ink3);}

/* ── TAGS ── */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:2px;white-space:nowrap;}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.tag-viv{background:var(--viv-t);color:var(--viv);} .tag-viv .dot{background:var(--viv);}
.tag-hot{background:var(--hot-t);color:var(--hot);} .tag-hot .dot{background:var(--hot);}
.tag-rest{background:var(--rest-t);color:var(--rest);} .tag-rest .dot{background:var(--rest);}
.tag-crit{background:var(--crit-t);color:var(--crit);} .tag-crit .dot{background:var(--crit);}
.tag-alto{background:var(--alto-t);color:var(--alto);} .tag-alto .dot{background:var(--alto);}
.tag-med{background:var(--med-t);color:var(--med);} .tag-med .dot{background:var(--med);}
.tag-baj{background:var(--baj-t);color:var(--baj);} .tag-baj .dot{background:var(--baj);}
.tag-vac{background:var(--vac-t);color:var(--vac);} .tag-vac .dot{background:var(--vac);}
.tag-out{background:transparent;border:1px solid var(--line);color:var(--ink3);}

/* ── TABLES ── */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
.tbl th{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:7px 10px;border-bottom:1px solid var(--line);background:var(--paper);text-align:left;white-space:nowrap;}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--paper2);vertical-align:top;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:rgba(194,105,66,.04);}
.tbl th:first-child,.tbl td:first-child{padding-left:14px;}

/* ── FOCUS LIST ── */
.focus-list{display:flex;flex-direction:column;gap:6px;}
.focus-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);}
.focus-item input[type=checkbox]{margin-top:2px;width:15px;height:15px;accent-color:var(--burg);cursor:pointer;flex-shrink:0;}
.focus-text{flex:1;font-size:13px;}
.focus-item.done .focus-text{color:var(--ink3);text-decoration:line-through;}

/* ── AGENDA ── */
.agenda-box{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:2px 14px;}
.agenda-row{display:flex;gap:14px;padding:9px 0;border-bottom:1px solid var(--paper2);font-size:13px;}
.agenda-row:last-child{border-bottom:none;}
.agenda-when{font-size:10.5px;font-weight:500;letter-spacing:.04em;color:var(--cop);width:90px;flex-shrink:0;padding-top:1px;}

/* ── GANTT ── */
.gantt{margin-top:12px;}
.gantt-months{display:grid;grid-template-columns:repeat(20,1fr);gap:1px;margin-bottom:3px;}
.gantt-month{font-size:8.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding-left:2px;}
.gantt-row{position:relative;margin-bottom:2px;}
.gantt-grid{display:grid;grid-template-columns:repeat(20,1fr);gap:1px;}
.gantt-cell{height:26px;background:var(--paper2);border-radius:1px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.gantt-cell.filled{cursor:pointer;}
.gantt-cell.filled:hover{filter:brightness(1.08);}
.gantt-label{font-size:7.5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.85);padding:0 2px;text-align:center;pointer-events:none;line-height:1;}
.gantt-cell.ph1 .gantt-label,.gantt-cell.ph9 .gantt-label{color:rgba(30,24,20,.5);}
.gantt-arrow{position:absolute;right:-1px;top:50%;transform:translateY(-50%);width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:5px solid rgba(0,0,0,.2);z-index:2;pointer-events:none;}
.gantt-today{position:absolute;top:-18px;bottom:0;width:2px;background:var(--burg);opacity:.65;pointer-events:none;z-index:3;}
.gantt-today-lbl{position:absolute;top:-17px;left:3px;font-size:8px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--burg);}
.gantt-weeks{display:grid;grid-template-columns:repeat(20,1fr);gap:1px;margin-top:2px;}
.gantt-week{font-size:7.5px;color:var(--ink3);padding-left:2px;overflow:hidden;white-space:nowrap;}
.gantt-cell.has-note::after{content:'';position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:var(--cop);}
/* phase colors */
.ph1{background:var(--ph1);} .ph2{background:var(--ph2);} .ph3{background:var(--ph3);}
.ph4{background:var(--ph4);} .ph5{background:var(--ph5);} .ph6{background:var(--ph6);}
.ph7{background:var(--ph7);} .ph8{background:var(--ph8);} .ph9{background:var(--ph9);}

/* ── PROJECT CARDS ── */
.proj-card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px;margin-bottom:10px;}
.proj-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.proj-name{font-size:14px;font-weight:500;}
.proj-tags{display:flex;gap:5px;flex-wrap:wrap;}
.proj-meta{display:grid;grid-template-columns:90px 1fr;gap:3px 6px;font-size:12px;color:var(--ink2);margin:8px 0;}
.proj-meta .k{font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding-top:1px;}
.hito-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.hito-text{font-size:13px;font-weight:500;}
.hito-date{font-size:11.5px;font-weight:300;color:var(--cop);}
.client-pill{font-size:9.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--burg);border:1px solid var(--burg);border-radius:999px;padding:2px 8px;display:inline-flex;align-items:center;gap:4px;}
.client-pill .dot{background:var(--burg);}

/* ── NOTE ── */
.note-area{margin-top:8px;}
.note-area label{font-size:9.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:4px;}
.note-area textarea{width:100%;min-height:40px;resize:vertical;font-family:var(--f);font-size:12.5px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;line-height:1.5;}
.note-area textarea:focus{outline:none;border-color:var(--cop);}

/* ── CARGA GRID ── */
.carga-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;}
.carga-card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 12px;}
.carga-card.vac{background:var(--vac-t);border-color:var(--vac);}
.carga-name{font-weight:500;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px;}
.carga-projs{font-size:11.5px;color:var(--ink3);}

/* ── COLLAPSIBLES ── */
details.collapse{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;margin-bottom:6px;}
details.collapse summary{cursor:pointer;padding:11px 14px;font-size:10.5px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);list-style:none;display:flex;align-items:center;gap:8px;}
details.collapse summary::before{content:'+';font-size:14px;color:var(--cop);width:12px;}
details.collapse[open] summary::before{content:'–';}
details.collapse .inner{padding:0 14px 14px;}

/* ── CHALLAN ── */
.challan-request{border:1px solid var(--cop3);border-radius:var(--r);background:#FFF8F4;padding:16px;}
.challan-request h4{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--cop);margin-bottom:12px;}
.challan-form{display:grid;gap:8px;}
.challan-form select,.challan-form input,.challan-form textarea{font-family:var(--f);font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;width:100%;}
.challan-form select:focus,.challan-form input:focus,.challan-form textarea:focus{outline:none;border-color:var(--cop);}
.challan-form label{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:3px;}
.btn-cop{font-family:var(--f);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:9px 18px;border-radius:2px;cursor:pointer;border:none;background:var(--burg);color:var(--cop);}
.btn-cop:hover{background:var(--burg2);}
.btn-ghost{font-family:var(--f);font-size:11px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;padding:7px 14px;border-radius:2px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink3);}
.btn-ghost:hover{border-color:var(--cop);color:var(--cop);}
.btn-danger{font-family:var(--f);font-size:11px;padding:7px 14px;border-radius:2px;cursor:pointer;border:1px solid var(--crit-t);background:transparent;color:var(--crit);}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(26,20,16,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px);}
.modal{background:var(--surface);border-radius:4px;width:100%;max-width:420px;box-shadow:0 8px 40px rgba(26,20,16,.22);overflow:hidden;}
.modal-head{background:var(--burg);padding:13px 18px;display:flex;justify-content:space-between;align-items:center;}
.modal-title{font-size:10.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--cop);}
.modal-sub{font-size:10px;font-weight:300;letter-spacing:.06em;color:rgba(194,105,66,.6);margin-top:2px;}
.modal-close{background:none;border:none;color:rgba(194,105,66,.6);font-size:20px;cursor:pointer;padding:0 2px;line-height:1;}
.modal-close:hover{color:var(--cop);}
.modal-body{padding:18px;}
.modal-body textarea{width:100%;min-height:90px;resize:vertical;font-family:var(--f);font-size:13px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;line-height:1.5;}
.modal-body textarea:focus{outline:none;border-color:var(--cop);}
.modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;align-items:center;}
.modal-foot .left{margin-right:auto;}

/* ── SEMANAS CRÍTICAS ── */
.sem-card{border-left:3px solid var(--line);padding:8px 12px;margin-bottom:6px;background:var(--surface);border-radius:0 var(--r) var(--r) 0;}
.sem-card.crit{border-left-color:var(--crit);}
.sem-card.alto{border-left-color:var(--alto);}
.sem-card.med{border-left-color:var(--med);}
.sem-week{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--cop);margin-bottom:4px;}
.sem-items{font-size:12.5px;color:var(--ink2);}

/* ── PRÓXIMAS SEMANAS ALE ── */
.prox-card{margin-bottom:8px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;}
.prox-head{background:var(--burg);color:var(--cop);font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;padding:7px 12px;}
.prox-body{padding:10px 12px;background:var(--surface);}
.prox-item{font-size:13px;color:var(--ink2);padding:3px 0;border-bottom:1px solid var(--paper2);}
.prox-item:last-child{border-bottom:none;}
.prox-item.alert{color:var(--crit);}
.prox-item.warn{color:var(--alto);}

/* ── FOOTER ── */
.foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;font-weight:300;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);}
.sync{display:flex;align-items:center;gap:6px;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--baj);}
.sync.saving .sync-dot{background:var(--med);}
.sync.error .sync-dot{background:var(--crit);}

@media(max-width:640px){
  .topbar{padding:14px 16px;}
  .tab{padding:10px 12px;font-size:10px;}
  .view-title{font-size:18px;}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-name"><span>Alejandra Pombo</span><span>Design Studio</span></span>
    <span class="brand-div"></span>
    <span class="brand-sub">PM Estudio</span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <span class="update-badge" id="update-badge"></span>
    <span class="week-badge" id="week-badge"></span>
  </div>
</header>
<nav class="tabs" id="tabs"></nav>
<div class="app"><main id="view"></main></div>
<footer class="foot" style="max-width:1020px;margin:0 auto;padding-left:20px;padding-right:20px;">
  <span class="sync" id="sync"><span class="sync-dot"></span>Sincronizado</span>
  <button class="btn-ghost" id="export-btn">Exportar estado</button>
</footer>
<script>

const WEEK_LABELS = ["1 SEP", "8 SEP", "15 SEP", "22 SEP", "29 SEP", "6 OCT", "13 OCT", "20 OCT", "27 OCT", "3 NOV", "10 NOV"];
const MONTHS = [["SEP", 0, 4], ["OCT", 5, 8], ["NOV", 9, 10]];
const TODAY_WEEK = 5;
const WEEK_LABEL = 'Semana 07 Oct 2026';
const WEEK_STAMP = 'SEM 07-10-2026';
const UPDATED = 'Actualizado 07 Oct 2026';
const MASTER = [];
const ALERTAS = [];
const AGENDA = [];
const MONTAJES = [];
const ALE_ALERTAS = [];
const ALE_HITOS = [];
const ALE_MONTAJES = [];
const ALE_PRESENCIA = [];
const ALE_PROXIMAS = [];
const RENDERS = [];
const RENDERS_FLUJO = [{"fase": "F1", "titulo": "Volumetría y capturas", "desc": "Planos + 3D + vistas marcadas. ~1 semana desde doc completa."}, {"fase": "F2", "titulo": "Materialidad y acabados", "desc": "Toda la info de acabados y mobiliario. 2-3 días."}, {"fase": "F3", "titulo": "Render final", "desc": "TODAS las correcciones cerradas ANTES de renderizar."}];
const RENDERS_REGLAS = ["Máx. 2-3 proyectos activos simultáneos por renderista.", "Nunca activar sin documentación 100% completa.", "PM es el filtro — nadie pasa trabajo sin visto bueno del PM."];
const RENDERS_VAC = '';
const FOCO_SEMANA = {};
const PROJS_PERSONA = {};
const DEPT_PERSONA = {};
const NOMBRE_PERSONA = {};
const VAC = {};
const DEPT_SECTIONS = {"VIVIENDA": [], "RESTAURANTES": [], "HOTELES": []};
const PERSON_ORDER = ["javi", "ale"];

</script>
<script>
/* ============================================================
   POMBO ESTUDIO — app.js
   Trabaja exclusivamente con MASTER_DATA, GLOBAL_DATA, PLANNING_DATA, META
   Todos los datos inyectados por generate_app.py
   ============================================================ */

/* ──────────────────────────────────────────────
   ESTADO LOCAL (localStorage)
   Checkboxes y notas por persona/proyecto
   ────────────────────────────────────────────── */
const S = {
  key: (pid, field) => `pombo_${pid}_${field}`,
  get: (pid, field, def = '') => {
    try { return localStorage.getItem(S.key(pid, field)) ?? def; }
    catch { return def; }
  },
  set: (pid, field, val) => {
    try { localStorage.setItem(S.key(pid, field), val); }
    catch {}
  },
  toggle: (pid, field) => {
    const v = S.get(pid, field, '0') === '1' ? '0' : '1';
    S.set(pid, field, v);
    return v === '1';
  }
};

/* ──────────────────────────────────────────────
   CRUCE DE DATOS: indexar GLOBAL y PLANNING por id
   ────────────────────────────────────────────── */
let _globalIdx = null;
let _planIdx   = null;

function buildIndexes() {
  _globalIdx = {};
  (GLOBAL_DATA || []).forEach(g => { _globalIdx[g.id] = g; });

  _planIdx = {};
  ((PLANNING_DATA || {}).proyectos || []).forEach(p => { _planIdx[p.id] = p; });
}

function globalOf(id) { return _globalIdx?.[id] || null; }
function planOf(id)   { return _planIdx?.[id]   || null; }

/* Enriquece un proyecto MASTER con datos de GLOBAL y PLANNING */
function enrich(proj) {
  return {
    ...proj,
    _global:   globalOf(proj.id),
    _plan:     planOf(proj.id),
  };
}

/* ──────────────────────────────────────────────
   SEMANA ACTUAL
   ────────────────────────────────────────────── */
function hoySemana() {
  return META?.hoy_semana || '';
}

/* Índice de una semana en PLANNING_DATA.semanas */
function semanaIdx(semana) {
  return (PLANNING_DATA?.semanas || []).indexOf(semana);
}

/* ──────────────────────────────────────────────
   CARGA POR PERSONA (calculada en APP)
   Cuenta proyectos activos de una persona en la semana actual
   ────────────────────────────────────────────── */
function cargaPersona(nombre) {
  const hoy = hoySemana();
  return (MASTER_DATA || []).filter(p => {
    if (!(p.equipo || []).includes(nombre)) return false;
    const plan = planOf(p.id);
    if (!plan) return false;
    return plan.timeline.some(t => t.semana === hoy);
  }).length;
}

/* ──────────────────────────────────────────────
   PERSONAS DEL EQUIPO (derivadas dinámicamente)
   ────────────────────────────────────────────── */
function getPersonas() {
  const set = new Set();
  (MASTER_DATA || []).forEach(p => {
    (p.equipo || []).forEach(nombre => {
      if (nombre) set.add(nombre);
    });
  });
  return [...set].sort();
}

/* ──────────────────────────────────────────────
   HELPERS DE ESTILO
   ────────────────────────────────────────────── */
function deptCls(dpto) {
  if (!dpto) return '';
  const d = dpto.toLowerCase();
  if (d.includes('vivienda'))     return 'dept-viv';
  if (d.includes('restaurante'))  return 'dept-rest';
  if (d.includes('hotel'))        return 'dept-hot';
  return '';
}

function atencionCls(nivel) {
  const n = (nivel || '').toLowerCase().replace(/\s+/g, '-');
  if (n.includes('maxima') || n.includes('máxima')) return 'risk-high';
  if (n.includes('alta'))                            return 'risk-med';
  if (n.includes('seguimiento'))                     return 'risk-low';
  if (n.includes('estable'))                         return 'risk-ok';
  return 'risk-none';
}

function atencionLbl(nivel) {
  return nivel || '—';
}

function phaseCls(fase) {
  if (!fase) return '';
  const f = fase.toLowerCase();
  if (f.includes('proy'))   return 'phase-proy';
  if (f.includes('obra'))   return 'phase-obra';
  if (f.includes('montaj')) return 'phase-mont';
  if (f.includes('cerrad')) return 'phase-cerr';
  return '';
}

function phaseShort(fase) {
  if (!fase) return '—';
  if (fase.length <= 10) return fase;
  return fase.slice(0, 9) + '…';
}

function tagDept(dpto) {
  return `<span class="tag-dept ${deptCls(dpto)}">${dpto || '—'}</span>`;
}

function tagAtencion(nivel) {
  return `<span class="tag-risk ${atencionCls(nivel)}">${atencionLbl(nivel)}</span>`;
}

/* ──────────────────────────────────────────────
   GANTT — VISTA GENERAL (ventana deslizante de 12 semanas)
   ────────────────────────────────────────────── */
const GENERAL_WEEKS = 12; // semanas visibles en vista general

function semanaWindow() {
  const semanas = PLANNING_DATA?.semanas || [];
  const hoyIdx = semanas.indexOf(hoySemana());
  if (semanas.length === 0) return [];
  const start = Math.max(0, hoyIdx);
  return semanas.slice(start, start + GENERAL_WEEKS);
}

/* Renderiza Gantt para la ventana de vista general */
function renderGanttGeneral(proj) {
  const ventana   = semanaWindow();
  const planProj  = proj._plan;
  if (!ventana.length) return '<div class="gantt-empty">Sin datos</div>';

  const hoy = hoySemana();
  let html = '<div class="gantt-row">';

  ventana.forEach(sem => {
    const esHoy  = sem === hoy;
    const entry  = planProj?.timeline.find(t => t.semana === sem);
    const tieneActividad = entry && entry.actividades && entry.actividades.length > 0;
    let cls = 'gantt-cell';
    if (esHoy) cls += ' gantt-today';
    if (tieneActividad) {
      const nivel = entry.actividades[0].nivel;
      cls += nivel === 'principal' ? ' gantt-active' : ' gantt-sec';
    }
    const titulo = tieneActividad
      ? entry.actividades.map(a => a.texto).join(' / ')
      : '';
    html += `<div class="${cls}" title="${esHoy ? '▶ ' : ''}${sem}${titulo ? ': ' + titulo : ''}" data-sem="${sem}" data-id="${proj.id}"></div>`;
  });

  html += '</div>';
  return html;
}

/* Renderiza Gantt completo para modal de proyecto (todas las semanas con datos) */
function renderGanttCompleto(proj) {
  const planProj = proj._plan;
  const todasSemanas = PLANNING_DATA?.semanas || [];
  if (!todasSemanas.length) return '<div class="gantt-empty">Sin datos de planning</div>';

  const hoy = hoySemana();

  // Determinar rango con actividad (o mostrar todo si no hay)
  const semanasConActividad = new Set(
    (planProj?.timeline || []).map(t => t.semana)
  );
  const semanas = todasSemanas; // todas — continuidad garantizada

  let html = '<div class="gantt-full">';
  html += '<div class="gantt-labels">';
  semanas.forEach(s => {
    html += `<div class="gantt-label${s === hoy ? ' gantt-today-label' : ''}">${s}</div>`;
  });
  html += '</div><div class="gantt-row">';

  semanas.forEach(sem => {
    const esHoy  = sem === hoy;
    const entry  = planProj?.timeline.find(t => t.semana === sem);
    const tieneActividad = entry && entry.actividades && entry.actividades.length > 0;
    let cls = 'gantt-cell';
    if (esHoy) cls += ' gantt-today';
    if (tieneActividad) {
      const nivel = entry.actividades[0].nivel;
      cls += nivel === 'principal' ? ' gantt-active' : ' gantt-sec';
    }
    const titulo = tieneActividad
      ? entry.actividades.map(a => a.texto).join(' / ')
      : (semanasConActividad.size > 0 && !tieneActividad ? 'sin actividad registrada' : '');
    html += `<div class="${cls}" title="${esHoy ? '▶ ' : ''}${sem}${titulo ? ': ' + titulo : ''}"></div>`;
  });

  html += '</div></div>';
  return html;
}

/* ──────────────────────────────────────────────
   TARJETA DE PROYECTO (lista)
   ────────────────────────────────────────────── */
function projCard(proj, opts = {}) {
  const g = proj._global;
  const done = S.get(proj.id, 'done') === '1';

  const atencion   = g?.atencion     || '';
  const bloqueador = g?.bloqueador   || '';
  const hito       = g?.proximo_hito || '';
  const fechaHito  = g?.fecha_hito   || '';

  const ganttHtml = opts.showGantt !== false
    ? `<div class="proj-gantt">${renderGanttGeneral(proj)}</div>`
    : '';

  const equipoHtml = (proj.equipo || []).length
    ? `<div class="proj-equipo">${proj.equipo.map(e => `<span class="tag-persona">${e}</span>`).join(' ')}</div>`
    : '';

  const bloqHtml = bloqueador
    ? `<div class="proj-bloq">⚠ ${bloqueador}</div>`
    : '';

  const hitoHtml = hito
    ? `<div class="proj-hito">→ ${hito}${fechaHito ? ' <em>' + fechaHito + '</em>' : ''}</div>`
    : '';

  return `
    <div class="proj-card ${done ? 'proj-done' : ''} ${atencionCls(atencion)}" data-id="${proj.id}">
      <div class="proj-header">
        <div class="proj-meta">
          ${tagDept(proj.dpto)}
          ${tagAtencion(atencion)}
          <span class="tag-phase ${phaseCls(proj.fase)}">${phaseShort(proj.fase)}</span>
        </div>
        <div class="proj-actions">
          <button class="btn-done" data-id="${proj.id}" title="Marcar completado">
            ${done ? '✓' : '○'}
          </button>
          <button class="btn-open" data-id="${proj.id}" title="Abrir ficha">↗</button>
        </div>
      </div>
      <div class="proj-nombre" data-id="${proj.id}">${proj.nombre}</div>
      ${hitoHtml}
      ${bloqHtml}
      ${equipoHtml}
      ${ganttHtml}
      <div class="proj-note-wrap">
        <textarea class="proj-note" data-id="${proj.id}" placeholder="Nota…" rows="1">${S.get(proj.id, 'note')}</textarea>
      </div>
    </div>`;
}

/* ──────────────────────────────────────────────
   MODAL DE PROYECTO (ficha completa)
   ────────────────────────────────────────────── */
let _modalId = null;

function openModal(id) {
  const proj = enrich(MASTER_DATA.find(p => p.id === id));
  if (!proj) return;
  _modalId = id;

  const g = proj._global;
  const plan = proj._plan;

  const equipoHtml = (proj.equipo || []).map(e =>
    `<span class="tag-persona">${e} <small>(${cargaPersona(e)} proy)</small></span>`
  ).join(' ');

  const actividadesHtml = (plan?.timeline || []).length
    ? plan.timeline.map(t => `
        <div class="plan-semana">
          <span class="plan-sem-lbl ${t.semana === hoySemana() ? 'plan-hoy' : ''}">${t.semana}</span>
          ${t.actividades.map(a =>
            `<span class="plan-act ${a.nivel === 'principal' ? 'plan-principal' : 'plan-sec'}">${a.texto}</span>`
          ).join('')}
        </div>`).join('')
    : '<p class="plan-empty">Sin actividad registrada en planning.</p>';

  const bloqueadorHtml = g?.bloqueador
    ? `<div class="modal-bloq">⚠ Bloqueador: ${g.bloqueador}</div>` : '';

  document.getElementById('modal-title').textContent = proj.nombre;
  document.getElementById('modal-body').innerHTML = `
    <div class="modal-section">
      <div class="modal-tags">
        ${tagDept(proj.dpto)}
        ${tagAtencion(g?.atencion)}
        <span class="tag-phase ${phaseCls(proj.fase)}">${proj.fase || '—'}</span>
      </div>
    </div>

    ${bloqueadorHtml}

    <div class="modal-grid">
      <div class="modal-field">
        <label>Próximo hito</label>
        <span>${g?.proximo_hito || '—'}</span>
      </div>
      <div class="modal-field">
        <label>Fecha hito</label>
        <span>${g?.fecha_hito || '—'}</span>
      </div>
      <div class="modal-field">
        <label>Constructora</label>
        <span>${proj.constructora || '—'}</span>
      </div>
      <div class="modal-field">
        <label>Fin obra previsto</label>
        <span>${proj.fin_obra || '—'}</span>
      </div>
      <div class="modal-field">
        <label>Montaje</label>
        <span>${proj.montaje || '—'}</span>
      </div>
      <div class="modal-field">
        <label>Finalización oficial</label>
        <span>${proj.fin_oficial || '—'}</span>
      </div>
    </div>

    <div class="modal-field">
      <label>Equipo</label>
      <div>${equipoHtml || '—'}</div>
    </div>

    ${proj.obs ? `<div class="modal-field"><label>Observaciones</label><span>${proj.obs}</span></div>` : ''}

    <div class="modal-section">
      <h3>Planning completo</h3>
      <div class="gantt-completo-wrap">
        ${renderGanttCompleto(proj)}
      </div>
      <div class="plan-actividades">${actividadesHtml}</div>
    </div>

    <div class="modal-section">
      <label>Nota personal</label>
      <textarea class="modal-note" data-id="${proj.id}" rows="3" placeholder="Nota privada (solo en este dispositivo)…">${S.get(proj.id, 'note')}</textarea>
    </div>
  `;

  document.getElementById('proj-modal').classList.remove('hidden');
}

function closeModal() {
  // Guardar nota antes de cerrar
  const ta = document.querySelector('.modal-note');
  if (ta && _modalId) S.set(_modalId, 'note', ta.value);
  document.getElementById('proj-modal').classList.add('hidden');
  _modalId = null;
}

/* ──────────────────────────────────────────────
   VISTA JAVI / PM
   Agrupado por dpto, con Gantt general visible
   Incluye: todos los proyectos, alerta de bloqueadores
   ────────────────────────────────────────────── */
function renderJavi() {
  const dptos = ['vivienda', 'restaurantes', 'hoteles'];
  let html = '';

  // Resumen de bloqueadores
  const bloqueados = (MASTER_DATA || []).filter(p => globalOf(p.id)?.bloqueador);
  if (bloqueados.length) {
    html += `<div class="alert-bar">
      <strong>⚠ Bloqueadores activos (${bloqueados.length}):</strong>
      ${bloqueados.map(p => `<span class="alert-item" data-id="${p.id}">${p.nombre}</span>`).join(', ')}
    </div>`;
  }

  // Semana actual destacada
  html += `<div class="week-banner">Semana actual: <strong>${hoySemana()}</strong></div>`;

  dptos.forEach(dpto => {
    const proyectos = (MASTER_DATA || [])
      .filter(p => p.dpto === dpto)
      .map(enrich);

    if (!proyectos.length) return;

    html += `<div class="dept-section">
      <h2 class="dept-title ${deptCls(dpto)}">${dpto.toUpperCase()}</h2>
      <div class="proj-list">
        ${proyectos.map(p => projCard(p)).join('')}
      </div>
    </div>`;
  });

  document.getElementById('main-content').innerHTML = html || '<p class="empty">Sin proyectos.</p>';
}

/* ──────────────────────────────────────────────
   VISTA ALEJANDRA / CEO
   Solo proyectos con atención MÁXIMA o ALTA
   Hitos próximos + bloqueadores destacados
   Sin Gantt (vista ejecutiva)
   ────────────────────────────────────────────── */
function renderAlejandra() {
  const prioritarios = (MASTER_DATA || [])
    .map(enrich)
    .filter(p => {
      const a = (p._global?.atencion || '').toLowerCase();
      return a.includes('máxima') || a.includes('maxima') || a.includes('alta');
    });

  const proximos = (MASTER_DATA || [])
    .map(enrich)
    .filter(p => p._global?.fecha_hito)
    .sort((a, b) => (a._global.fecha_hito || '') < (b._global.fecha_hito || '') ? -1 : 1)
    .slice(0, 8);

  let html = `<div class="week-banner">Semana actual: <strong>${hoySemana()}</strong></div>`;

  // Proyectos prioritarios
  html += `<div class="ale-section">
    <h2>Atención requerida (${prioritarios.length})</h2>
    <div class="proj-list">
      ${prioritarios.length
        ? prioritarios.map(p => projCard(p, { showGantt: false })).join('')
        : '<p class="empty">Sin proyectos en atención alta.</p>'}
    </div>
  </div>`;

  // Próximos hitos
  if (proximos.length) {
    html += `<div class="ale-section">
      <h2>Próximos hitos</h2>
      <table class="hitos-table">
        <thead><tr><th>Proyecto</th><th>Dpto</th><th>Hito</th><th>Fecha</th></tr></thead>
        <tbody>
          ${proximos.map(p => `
            <tr class="hitos-row" data-id="${p.id}">
              <td>${p.nombre}</td>
              <td>${tagDept(p.dpto)}</td>
              <td>${p._global?.proximo_hito || '—'}</td>
              <td>${p._global?.fecha_hito || '—'}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  }

  document.getElementById('main-content').innerHTML = html;
}

/* ──────────────────────────────────────────────
   VISTA PERSONA (individual — derivada dinámicamente)
   Proyectos donde nombre aparece en equipo
   Gantt general + carga de la semana
   ────────────────────────────────────────────── */
function renderPersona(nombre) {
  const proyectos = (MASTER_DATA || [])
    .filter(p => (p.equipo || []).includes(nombre))
    .map(enrich);

  const carga = cargaPersona(nombre);
  const hoy = hoySemana();

  // Proyectos activos esta semana
  const activos = proyectos.filter(p =>
    (p._plan?.timeline || []).some(t => t.semana === hoy)
  );

  let html = `
    <div class="persona-header">
      <h2>${nombre}</h2>
      <div class="persona-stats">
        <span class="stat">${proyectos.length} proyectos totales</span>
        <span class="stat active">${carga} activos esta semana</span>
      </div>
    </div>`;

  if (activos.length) {
    html += `<div class="dept-section">
      <h3>Esta semana (${hoy})</h3>
      <div class="proj-list">
        ${activos.map(p => projCard(p)).join('')}
      </div>
    </div>`;
  }

  const resto = proyectos.filter(p => !activos.includes(p));
  if (resto.length) {
    html += `<div class="dept-section">
      <h3>Resto de proyectos</h3>
      <div class="proj-list">
        ${resto.map(p => projCard(p, { showGantt: false })).join('')}
      </div>
    </div>`;
  }

  if (!proyectos.length) {
    html += '<p class="empty">Sin proyectos asignados.</p>';
  }

  document.getElementById('main-content').innerHTML = html;
}

/* ──────────────────────────────────────────────
   TABS Y NAVEGACIÓN
   ────────────────────────────────────────────── */
let curTab = 'javi';

function buildTabs() {
  const personas = getPersonas();
  const tabsEl = document.getElementById('tabs');
  if (!tabsEl) return;

  const fixed = [
    { id: 'javi',      label: 'Javi / PM' },
    { id: 'alejandra', label: 'Alejandra' },
  ];

  const personaTabs = personas.map(nombre => ({
    id: 'persona__' + nombre.toLowerCase().replace(/\s+/g, '_'),
    label: nombre,
    nombre
  }));

  const allTabs = [...fixed, ...personaTabs];

  tabsEl.innerHTML = allTabs.map(t =>
    `<button class="tab-btn ${t.id === curTab ? 'active' : ''}" data-tab="${t.id}">${t.label}</button>`
  ).join('');
}

function activateTab(tabId) {
  curTab = tabId;

  // Actualizar estado visual
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tabId);
  });

  // Renderizar contenido
  if (tabId === 'javi') {
    renderJavi();
  } else if (tabId === 'alejandra') {
    renderAlejandra();
  } else if (tabId.startsWith('persona__')) {
    // Recuperar nombre original de MASTER_DATA
    const personas = getPersonas();
    const slug = tabId.replace('persona__', '');
    const nombre = personas.find(n =>
      n.toLowerCase().replace(/\s+/g, '_') === slug
    );
    if (nombre) renderPersona(nombre);
  }
}

/* ──────────────────────────────────────────────
   BÚSQUEDA
   ────────────────────────────────────────────── */
function applySearch(query) {
  const q = query.toLowerCase().trim();
  if (!q) {
    activateTab(curTab);
    return;
  }

  const resultados = (MASTER_DATA || [])
    .map(enrich)
    .filter(p => {
      const g = p._global;
      return (
        p.nombre.toLowerCase().includes(q) ||
        (p.dpto || '').toLowerCase().includes(q) ||
        (p.fase || '').toLowerCase().includes(q) ||
        (g?.atencion || '').toLowerCase().includes(q) ||
        (g?.proximo_hito || '').toLowerCase().includes(q) ||
        (g?.bloqueador || '').toLowerCase().includes(q) ||
        (p.equipo || []).some(e => e.toLowerCase().includes(q))
      );
    });

  document.getElementById('main-content').innerHTML = resultados.length
    ? `<div class="search-results">
        <p class="search-header">${resultados.length} resultado${resultados.length !== 1 ? 's' : ''} para "<strong>${query}</strong>"</p>
        <div class="proj-list">${resultados.map(p => projCard(p)).join('')}</div>
      </div>`
    : `<p class="empty">Sin resultados para "<strong>${query}</strong>"</p>`;
}

/* ──────────────────────────────────────────────
   EXPORTAR RESUMEN
   ────────────────────────────────────────────── */
function exportResumen() {
  const hoy = new Date().toLocaleDateString('es-ES');
  const semana = hoySemana();

  let lines = [
    `RESUMEN POMBO ESTUDIO — ${hoy} (${semana})`,
    '='.repeat(50),
    ''
  ];

  const dptos = ['vivienda', 'restaurantes', 'hoteles'];
  dptos.forEach(dpto => {
    const proyectos = (MASTER_DATA || []).filter(p => p.dpto === dpto);
    if (!proyectos.length) return;
    lines.push(`\n── ${dpto.toUpperCase()} (${proyectos.length}) ──`);
    proyectos.forEach(p => {
      const g = globalOf(p.id);
      lines.push(`  ${p.nombre}`);
      if (g?.atencion)     lines.push(`    Atención: ${g.atencion}`);
      if (g?.proximo_hito) lines.push(`    Hito: ${g.proximo_hito}${g.fecha_hito ? ' – ' + g.fecha_hito : ''}`);
      if (g?.bloqueador)   lines.push(`    ⚠ ${g.bloqueador}`);
    });
  });

  const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `pombo_resumen_${semana.replace('/', '-')}.txt`;
  a.click();
}

/* ──────────────────────────────────────────────
   EVENTOS
   ────────────────────────────────────────────── */
function wireEvents() {
  // Tabs
  document.getElementById('tabs')?.addEventListener('click', e => {
    const btn = e.target.closest('.tab-btn');
    if (btn) activateTab(btn.dataset.tab);
  });

  // Búsqueda
  const searchEl = document.getElementById('search-input');
  if (searchEl) {
    let debounce;
    searchEl.addEventListener('input', e => {
      clearTimeout(debounce);
      debounce = setTimeout(() => applySearch(e.target.value), 250);
    });
  }

  // Clic en contenido principal (delegado)
  document.getElementById('main-content')?.addEventListener('click', e => {
    // Abrir modal
    const btnOpen = e.target.closest('.btn-open');
    if (btnOpen) { openModal(btnOpen.dataset.id); return; }

    // Abrir modal al hacer click en nombre
    const nombre = e.target.closest('.proj-nombre');
    if (nombre) { openModal(nombre.dataset.id); return; }

    // Toggle done
    const btnDone = e.target.closest('.btn-done');
    if (btnDone) {
      const id = btnDone.dataset.id;
      const isDone = S.toggle(id, 'done');
      btnDone.textContent = isDone ? '✓' : '○';
      btnDone.closest('.proj-card')?.classList.toggle('proj-done', isDone);
      return;
    }

    // Abrir modal desde alerta/hito
    const alertItem = e.target.closest('.alert-item, .hitos-row');
    if (alertItem?.dataset.id) { openModal(alertItem.dataset.id); return; }
  });

  // Guardar notas (delegado)
  document.getElementById('main-content')?.addEventListener('change', e => {
    const ta = e.target.closest('.proj-note');
    if (ta) S.set(ta.dataset.id, 'note', ta.value);
  });

  // Modal: cerrar
  document.getElementById('modal-close')?.addEventListener('click', closeModal);
  document.getElementById('proj-modal')?.addEventListener('click', e => {
    if (e.target === document.getElementById('proj-modal')) closeModal();
  });

  // Modal: guardar nota al cambiar
  document.getElementById('modal-body')?.addEventListener('change', e => {
    const ta = e.target.closest('.modal-note');
    if (ta && _modalId) S.set(_modalId, 'note', ta.value);
  });

  // Exportar
  document.getElementById('btn-export')?.addEventListener('click', exportResumen);

  // ESC cierra modal
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });
}

/* ──────────────────────────────────────────────
   INIT
   ────────────────────────────────────────────── */
function init() {
  buildIndexes();
  buildTabs();
  wireEvents();
  activateTab('javi');

  // Info de actualización
  const updEl = document.getElementById('updated-at');
  if (updEl && META?.updated) {
    updEl.textContent = 'Actualizado: ' + META.updated.replace('T', ' ').slice(0, 16);
  }
}

document.addEventListener('DOMContentLoaded', init);
