<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APDS · PM Estudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --paper:#F4F1EC; --paper2:#EDE8E0; --surface:#FFF;
  --ink:#1A1410; --ink2:#5C5248; --ink3:#9C9088; --line:#DDD6CC;
  --burg:#3C1F21; --burg2:#5A3134; --burg3:#7A4548;
  --cop:#C26942; --cop2:#D4845A; --cop3:rgba(194,105,66,.15);
  --viv:#3D6491; --viv-t:#E4ECF5;
  --hot:#436B3A; --hot-t:#E3EDE0;
  --rest:#B35D30; --rest-t:#F5E4D8;
  --crit:#A82E2E; --crit-t:#F4DEDE;
  --alto:#B86328; --alto-t:#F4E4D6;
  --med:#967A1E; --med-t:#F0EAD2;
  --baj:#4E7A42; --baj-t:#DFF0D8;
  --vac:#7A736B; --vac-t:#EDEAE5;
  --ph1:#8A96BB; --ph2:#C0825A; --ph3:#C8A84E;
  --ph4:#6A9E90; --ph5:#7AA4CC; --ph6:#72A86C;
  --ph7:#B87EA8; --ph8:#B84040; --ph9:#C4BDB4;
  --r:3px; --f:'Inter','Helvetica Neue',Arial,sans-serif;
}
html,body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}

/* ── TOP BAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;background:var(--burg);gap:16px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:16px;}
.brand-name{font-size:12px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--cop);line-height:1.4;}
.brand-name span{display:block;}
.brand-div{width:1px;height:28px;background:var(--burg3);}
.brand-sub{font-size:10.5px;font-weight:300;letter-spacing:.12em;text-transform:uppercase;color:rgba(194,105,66,.6);}
.week-badge{font-size:10px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--cop);border:1px solid var(--burg3);padding:5px 12px;border-radius:2px;}
.update-badge{font-size:10px;color:rgba(194,105,66,.5);letter-spacing:.06em;}

/* ── TABS ── */
.tabs{display:flex;gap:0;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--line);padding:0 20px;flex-wrap:nowrap;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{font-size:11px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;padding:12px 18px;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--ink3);cursor:pointer;white-space:nowrap;transition:.15s;margin-bottom:-1px;}
.tab:hover{color:var(--ink);border-bottom-color:var(--line);}
.tab.active{color:var(--burg);border-bottom-color:var(--cop);font-weight:500;}
.tab.tab-master{color:var(--cop2);}
.tab.tab-master.active{color:var(--burg);}

/* ── LAYOUT ── */
.app{max-width:1020px;margin:0 auto;padding:0 20px 80px;}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:10px;margin:28px 0 24px;padding-bottom:16px;border-bottom:1px solid var(--line);}
.view-title{font-size:22px;font-weight:300;letter-spacing:.06em;text-transform:uppercase;color:var(--burg);}
.view-sub{font-size:11px;font-weight:300;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-top:5px;}
.view-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}

/* ── PANELS ── */
.panel{margin-bottom:24px;}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.eyebrow{font-size:10.5px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);}
.eyebrow::after{content:'';display:inline-block;height:1px;width:60px;background:var(--line);margin-left:10px;vertical-align:middle;}
.panel-note{font-size:11px;color:var(--ink3);}

/* ── TAGS ── */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:2px;white-space:nowrap;}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.tag-viv{background:var(--viv-t);color:var(--viv);} .tag-viv .dot{background:var(--viv);}
.tag-hot{background:var(--hot-t);color:var(--hot);} .tag-hot .dot{background:var(--hot);}
.tag-rest{background:var(--rest-t);color:var(--rest);} .tag-rest .dot{background:var(--rest);}
.tag-crit{background:var(--crit-t);color:var(--crit);} .tag-crit .dot{background:var(--crit);}
.tag-alto{background:var(--alto-t);color:var(--alto);} .tag-alto .dot{background:var(--alto);}
.tag-med{background:var(--med-t);color:var(--med);} .tag-med .dot{background:var(--med);}
.tag-baj{background:var(--baj-t);color:var(--baj);} .tag-baj .dot{background:var(--baj);}
.tag-vac{background:var(--vac-t);color:var(--vac);} .tag-vac .dot{background:var(--vac);}
.tag-out{background:transparent;border:1px solid var(--line);color:var(--ink3);}

/* ── TABLES ── */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
.tbl th{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:7px 10px;border-bottom:1px solid var(--line);background:var(--paper);text-align:left;white-space:nowrap;}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--paper2);vertical-align:top;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:rgba(194,105,66,.04);}
.tbl th:first-child,.tbl td:first-child{padding-left:14px;}

/* ── FOCUS LIST ── */
.focus-list{display:flex;flex-direction:column;gap:6px;}
.focus-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);}
.focus-item input[type=checkbox]{margin-top:2px;width:15px;height:15px;accent-color:var(--burg);cursor:pointer;flex-shrink:0;}
.focus-text{flex:1;font-size:13px;}
.focus-item.done .focus-text{color:var(--ink3);text-decoration:line-through;}

/* ── AGENDA ── */
.agenda-box{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:2px 14px;}
.agenda-row{display:flex;gap:14px;padding:9px 0;border-bottom:1px solid var(--paper2);font-size:13px;}
.agenda-row:last-child{border-bottom:none;}
.agenda-when{font-size:10.5px;font-weight:500;letter-spacing:.04em;color:var(--cop);width:90px;flex-shrink:0;padding-top:1px;}

/* ── GANTT ── */
.gantt{margin-top:12px;}
.gantt-months{display:grid;grid-template-columns:repeat(20,1fr);gap:1px;margin-bottom:3px;}
.gantt-month{font-size:8.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding-left:2px;}
.gantt-row{position:relative;margin-bottom:2px;}
.gantt-grid{display:grid;grid-template-columns:repeat(20,1fr);gap:1px;}
.gantt-cell{height:26px;background:var(--paper2);border-radius:1px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.gantt-cell.filled{cursor:pointer;}
.gantt-cell.filled:hover{filter:brightness(1.08);}
.gantt-label{font-size:7.5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.85);padding:0 2px;text-align:center;pointer-events:none;line-height:1;}
.gantt-cell.ph1 .gantt-label,.gantt-cell.ph9 .gantt-label{color:rgba(30,24,20,.5);}
.gantt-arrow{position:absolute;right:-1px;top:50%;transform:translateY(-50%);width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:5px solid rgba(0,0,0,.2);z-index:2;pointer-events:none;}
.gantt-today{position:absolute;top:-18px;bottom:0;width:2px;background:var(--burg);opacity:.65;pointer-events:none;z-index:3;}
.gantt-today-lbl{position:absolute;top:-17px;left:3px;font-size:8px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--burg);}
.gantt-weeks{display:grid;grid-template-columns:repeat(20,1fr);gap:1px;margin-top:2px;}
.gantt-week{font-size:7.5px;color:var(--ink3);padding-left:2px;overflow:hidden;white-space:nowrap;}
.gantt-cell.has-note::after{content:'';position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:var(--cop);}
/* phase colors */
.ph1{background:var(--ph1);} .ph2{background:var(--ph2);} .ph3{background:var(--ph3);}
.ph4{background:var(--ph4);} .ph5{background:var(--ph5);} .ph6{background:var(--ph6);}
.ph7{background:var(--ph7);} .ph8{background:var(--ph8);} .ph9{background:var(--ph9);}
/* pendiente de planificación: rango activo sin actividad registrada NI fase inferible */
.ph-pending{background:repeating-linear-gradient(135deg,var(--paper2) 0px,var(--paper2) 4px,rgba(180,170,160,.25) 4px,rgba(180,170,160,.25) 8px);border:1px dashed rgba(150,140,130,.4);}
/* continuidad de fase: semana sin registro explícito, rellena con la última fase conocida */
.ph-continuidad{opacity:.72;}

/* ── PROJECT CARDS ── */
.proj-card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px;margin-bottom:10px;}
.proj-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.proj-name{font-size:14px;font-weight:500;}
.proj-tags{display:flex;gap:5px;flex-wrap:wrap;}
.proj-meta{display:grid;grid-template-columns:90px 1fr;gap:3px 6px;font-size:12px;color:var(--ink2);margin:8px 0;}
.proj-meta .k{font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding-top:1px;}
.hito-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.hito-text{font-size:13px;font-weight:500;}
.hito-date{font-size:11.5px;font-weight:300;color:var(--cop);}
.client-pill{font-size:9.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--burg);border:1px solid var(--burg);border-radius:999px;padding:2px 8px;display:inline-flex;align-items:center;gap:4px;}
.client-pill .dot{background:var(--burg);}

/* ── NOTE ── */
.note-area{margin-top:8px;}
.note-area label{font-size:9.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:4px;}
.note-area textarea{width:100%;min-height:40px;resize:vertical;font-family:var(--f);font-size:12.5px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;line-height:1.5;}
.note-area textarea:focus{outline:none;border-color:var(--cop);}

/* ── CARGA GRID ── */
.carga-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;}
.carga-card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 12px;}
.carga-card.vac{background:var(--vac-t);border-color:var(--vac);}
.carga-name{font-weight:500;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px;}
.carga-projs{font-size:11.5px;color:var(--ink3);}

/* ── COLLAPSIBLES ── */
details.collapse{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;margin-bottom:6px;}
details.collapse summary{cursor:pointer;padding:11px 14px;font-size:10.5px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);list-style:none;display:flex;align-items:center;gap:8px;}
details.collapse summary::before{content:'+';font-size:14px;color:var(--cop);width:12px;}
details.collapse[open] summary::before{content:'–';}
details.collapse .inner{padding:0 14px 14px;}

/* ── CHALLAN ── */
.challan-request{border:1px solid var(--cop3);border-radius:var(--r);background:#FFF8F4;padding:16px;}
.challan-request h4{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--cop);margin-bottom:12px;}
.challan-form{display:grid;gap:8px;}
.challan-form select,.challan-form input,.challan-form textarea{font-family:var(--f);font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;width:100%;}
.challan-form select:focus,.challan-form input:focus,.challan-form textarea:focus{outline:none;border-color:var(--cop);}
.challan-form label{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:3px;}
.btn-cop{font-family:var(--f);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:9px 18px;border-radius:2px;cursor:pointer;border:none;background:var(--burg);color:var(--cop);}
.btn-cop:hover{background:var(--burg2);}
.btn-ghost{font-family:var(--f);font-size:11px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;padding:7px 14px;border-radius:2px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink3);}
.btn-ghost:hover{border-color:var(--cop);color:var(--cop);}
.btn-danger{font-family:var(--f);font-size:11px;padding:7px 14px;border-radius:2px;cursor:pointer;border:1px solid var(--crit-t);background:transparent;color:var(--crit);}

/* ── MODAL BASE (genérico, pequeño) ── */
.modal-bg{position:fixed;inset:0;background:rgba(26,20,16,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px);}
.modal{background:var(--surface);border-radius:4px;width:min(96vw,480px);max-height:90vh;overflow:auto;box-shadow:0 8px 40px rgba(26,20,16,.22);}
/* modal-ficha: VER PROYECTO — ocupa 88% ancho × 88% alto */
.modal-ficha{
  width:88vw !important;
  max-width:88vw !important;
  min-width:min(88vw,640px) !important;
  min-height:82vh;
  max-height:88vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.modal-head{background:var(--burg);padding:13px 18px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.modal-title{font-size:10.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--cop);}
.modal-sub{font-size:10px;font-weight:300;letter-spacing:.06em;color:rgba(194,105,66,.6);margin-top:2px;}
.modal-close{background:none;border:none;color:rgba(194,105,66,.6);font-size:20px;cursor:pointer;padding:0 2px;line-height:1;}
.modal-close:hover{color:var(--cop);}
.modal-body{padding:18px;}
.modal-body textarea{width:100%;min-height:90px;resize:vertical;font-family:var(--f);font-size:13px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;line-height:1.5;}
.modal-body textarea:focus{outline:none;border-color:var(--cop);}
.modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;align-items:center;flex-shrink:0;}
.modal-foot .left{margin-right:auto;}

/* ── SEMANAS CRÍTICAS ── */
.sem-card{border-left:3px solid var(--line);padding:8px 12px;margin-bottom:6px;background:var(--surface);border-radius:0 var(--r) var(--r) 0;}
.sem-card.crit{border-left-color:var(--crit);}
.sem-card.alto{border-left-color:var(--alto);}
.sem-card.med{border-left-color:var(--med);}
.sem-week{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--cop);margin-bottom:4px;}
.sem-items{font-size:12.5px;color:var(--ink2);}

/* ── PRÓXIMAS SEMANAS ALE ── */
.prox-card{margin-bottom:8px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;}
.prox-head{background:var(--burg);color:var(--cop);font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;padding:7px 12px;}
.prox-body{padding:10px 12px;background:var(--surface);}
.prox-item{font-size:13px;color:var(--ink2);padding:3px 0;border-bottom:1px solid var(--paper2);}
.prox-item:last-child{border-bottom:none;}
.prox-item.alert{color:var(--crit);}
.prox-item.warn{color:var(--alto);}

/* ── FOOTER ── */
.foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;font-weight:300;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);}
.sync{display:flex;align-items:center;gap:6px;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--baj);}
.sync.saving .sync-dot{background:var(--med);}
.sync.error .sync-dot{background:var(--crit);}

@media(max-width:640px){
  .topbar{padding:14px 16px;}
  .tab{padding:10px 12px;font-size:10px;}
  .view-title{font-size:18px;}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-name"><span>Alejandra Pombo</span><span>Design Studio</span></span>
    <span class="brand-div"></span>
    <span class="brand-sub">PM Estudio</span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <span class="update-badge" id="update-badge"></span>
    <span class="week-badge" id="week-badge"></span>
  </div>
</header>
<nav class="tabs" id="tabs"></nav>
<div class="app"><main id="view"></main></div>
<footer class="foot" style="max-width:1020px;margin:0 auto;padding-left:20px;padding-right:20px;">
  <span class="sync" id="sync"><span class="sync-dot"></span>Sincronizado</span>
  <button class="btn-ghost" id="export-btn">Exportar estado</button>
</footer>
<script>

const MASTER_DATA = [];
const GLOBAL_DATA = [];
const PLANNING_DATA = {"semanas": ["1 SEP", "8 SEP", "15 SEP", "22 SEP", "29 SEP", "6 OCT", "13 OCT", "20 OCT", "27 OCT", "3 NOV", "10 NOV"], "meses": [["SEP", 0, 4], ["OCT", 5, 8], ["NOV", 9, 10]], "hoy": "27 OCT", "proyectos": []};
const META = {"updated": "27 Oct 2026", "hoy_semana": "27 OCT"};
const ALERTAS = [];

<script>
/* ============================================================
   POMBO ESTUDIO — app.js
   Usa MASTER_DATA, GLOBAL_DATA, PLANNING_DATA, META
   ============================================================ */

/* ── localStorage ─────────────────────────────────────────── */
const S = {
  key:    (pid, f)    => `pombo_${pid}_${f}`,
  get:    (pid, f, d='') => { try { return localStorage.getItem(S.key(pid,f)) ?? d; } catch { return d; } },
  set:    (pid, f, v) => { try { localStorage.setItem(S.key(pid,f), v); } catch {} },
  toggle: (pid, f)    => { const v = S.get(pid,f,'0')==='1'?'0':'1'; S.set(pid,f,v); return v==='1'; }
};

/* ── Índices ──────────────────────────────────────────────── */
let _gIdx = null, _pIdx = null;

function buildIndexes() {
  _gIdx = {}; (GLOBAL_DATA||[]).forEach(g => { _gIdx[g.id] = g; });
  _pIdx = {}; ((PLANNING_DATA||{}).proyectos||[]).forEach(p => { _pIdx[p.id] = p; });
}

const globalOf = id => _gIdx?.[id] || null;
const planOf   = id => _pIdx?.[id] || null;

function enrich(p) {
  return { ...p, _g: globalOf(p.id), _p: planOf(p.id) };
}

/* ── Semanas ──────────────────────────────────────────────── */
// META.hoy_semana es el label string de la semana actual (p.ej. "5 OCT")
const hoySemana = () => META?.hoy_semana || '';
const VENTANA   = 6; // semanas hacia adelante en la tarjeta

function semanaWindow() {
  const sems = PLANNING_DATA?.semanas || [];
  const i    = sems.indexOf(hoySemana());
  if (i < 0) return sems.slice(0, VENTANA);
  return sems.slice(i, i + VENTANA);
}

/* ── Personas ─────────────────────────────────────────────── */
// Javier, Alejandra y Alicia no aparecen en las pestañas del equipo
const EXCLUIR_PERSONAS = ['Alicia', 'Javier', 'Alejandra', 'Javi', 'alicia'];

function getPersonas() {
  const s = new Set();
  (MASTER_DATA||[]).forEach(p => (p.equipo||[]).forEach(n => {
    if (n && typeof n === 'string' && n.trim() && !/^\d+$/.test(n.trim())
        && !EXCLUIR_PERSONAS.includes(n.trim())) {
      s.add(n.trim());
    }
  }));
  return [...s].sort();
}

/* ── Nivel de atención ────────────────────────────────────── */
function atLevel(proj) {
  const a = (proj._g?.atencion || proj.atencion || '').toUpperCase();
  if (a.includes('MÁXIMA') || a.includes('MAXIMA')) return 0;
  if (a.includes('ALTA'))                            return 1;
  if (a.includes('SEGUIMIENTO'))                     return 2;
  return 3;
}

/* ── Helpers estilo ──────────────────────────────────────── */
function deptTag(dpto) {
  const d = (dpto||'').toUpperCase();
  if (d.includes('VIVIENDA'))    return ['tag-viv',  'VIVIENDA'];
  if (d.includes('RESTAURANTE')) return ['tag-rest', 'REST'];
  if (d.includes('HOTEL'))       return ['tag-hot',  'HOTEL'];
  return ['tag-out', dpto||'—'];
}

function riskTag(nivel) {
  const n = (nivel||'').toUpperCase();
  if (n.includes('MÁXIMA')||n.includes('MAXIMA')) return ['tag-crit','● ALERTA'];
  if (n.includes('ALTA'))                          return ['tag-alto','● ATENCIÓN'];
  if (n.includes('SEGUIMIENTO'))                   return ['tag-med', '● INFO'];
  if (n.includes('ESTABLE'))                       return ['tag-baj', '● OK'];
  return ['tag-out','—'];
}

function tagHtml(cls, txt) {
  return `<span class="tag ${cls}">${txt}</span>`;
}

/* ── Helpers texto ───────────────────────────────────────── */
function abrev(txt) {
  if (!txt) return '';
  const t = txt.toUpperCase();
  if (t.includes('ANTEPR'))  return 'APY';
  if (t.includes('PROY'))    return 'PRY';
  if (t.includes('VALORAC')) return 'VAL';
  if (t.includes('OBRA'))    return 'OBR';
  if (t.includes('MONTAJ'))  return 'MNT';
  if (t.includes('ENTREGA')) return 'ENT';
  if (t.includes('RENDER'))  return 'RND';
  if (t.includes('VISITA'))  return 'VIS';
  if (t.includes('PEDIDO'))  return 'PED';
  if (t.includes('REMATE'))  return 'REM';
  if (t.includes('PARAD') || t.includes('ESPERA') || t.includes('STANDBY')) return '···';
  return txt.slice(0,3).toUpperCase();
}

// Colores coherentes con PLANNING_POMBO
function faseColor(txt) {
  const t = (txt||'').toUpperCase();
  if (t.includes('ANTEPR'))  return 'ph1';
  if (t.includes('PROY') || t.includes('DISEÑO') || t.includes('VALORAC')) return 'ph1';
  if (t.includes('OBRA'))    return 'ph2';
  if (t.includes('MONTAJ'))  return 'ph3';
  if (t.includes('ENTREGA')) return 'ph4';
  if (t.includes('RENDER'))  return 'ph5';
  if (t.includes('VISITA'))  return 'ph6';
  if (t.includes('PEDIDO') || t.includes('REMATE')) return 'ph7';
  if (t.includes('PARAD') || t.includes('ESPERA') || t.includes('STANDBY')) return 'ph9';
  return 'ph1';
}

function row2(k, v) {
  if (!v || v === '—' || v === 'None') return '';
  return `<tr>
    <td style="color:var(--ink3);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
               padding:4px 0;width:130px;vertical-align:top;">${k}</td>
    <td style="padding:4px 0;font-size:12.5px;">${v}</td>
  </tr>`;
}

function row2Always(k, v) {
  return `<tr>
    <td style="color:var(--ink3);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
               padding:4px 0;width:130px;vertical-align:top;">${k}</td>
    <td style="padding:4px 0;font-size:12.5px;color:${(!v||v==='—')?'var(--ink3)':'inherit'};">${v||'Sin fecha registrada'}</td>
  </tr>`;
}

/* ── Activity helpers ────────────────────────────────────── */
function projHasActivityThisWeek(proj) {
  const hoy = hoySemana();
  return (proj._p?.timeline||[]).some(t => t.semana === hoy);
}

function projHasActivityInWindow(proj, startOffset, endOffset) {
  const allSems = PLANNING_DATA?.semanas || [];
  const hoyIdx  = allSems.indexOf(hoySemana());
  if (hoyIdx < 0) return false;
  const win = allSems.slice(hoyIdx + startOffset, hoyIdx + endOffset + 1);
  return (proj._p?.timeline||[]).some(t => win.includes(t.semana));
}

/* ── Gantt tarjeta (ventana operativa compacta) ──────────── */
function ganttGeneral(proj) {
  const ventana  = semanaWindow();
  const allSems  = PLANNING_DATA?.semanas || [];
  const hoy      = hoySemana();
  if (!ventana.length) return '';

  // Determinar si el proyecto está oficialmente parado
  const estadoRaw = (proj.estado || proj._g?.fase_real || proj.fase || '').toUpperCase();
  const isParado  = /PARAD|ESPERA|STANDBY|STOP|HOLD/.test(estadoRaw);

  // Rango activo en TODO el planning (no solo en la ventana)
  const timeline   = proj._p?.timeline || [];
  const activeSems = new Set(timeline.filter(t => t.actividades?.length).map(t => t.semana));
  let firstActive  = null, lastActive = null;
  allSems.forEach(sem => {
    if (activeSems.has(sem)) {
      if (!firstActive) firstActive = sem;
      lastActive = sem;
    }
  });
  // Si el proyecto no está parado, extender lastActive hasta hoy (inclusive)
  if (!isParado && lastActive) {
    const lastIdx = allSems.indexOf(lastActive);
    const hoyIdx  = allSems.indexOf(hoy);
    if (hoyIdx > lastIdx) lastActive = hoy;
  }
  const firstIdxAll = firstActive ? allSems.indexOf(firstActive) : -1;
  const lastIdxAll  = lastActive  ? allSems.indexOf(lastActive)  : -1;

  let weeksHtml = '<div class="gantt-weeks">';
  ventana.forEach(sem => {
    const isHoy = sem === hoy;
    weeksHtml += `<div class="gantt-week${isHoy?' gantt-week-hoy':''}" style="font-size:9px;">${sem}</div>`;
  });
  weeksHtml += '</div>';

  // Construir mapa semana→fase para forward-fill dentro de app.js
  // (el forward-fill entre semanas con registros ya viene de generate_app.py;
  //  aquí solo cubrimos la extensión desde lastActive hasta hoy)
  const textoMap = {};
  let lastKnownTexto = '';
  allSems.forEach(sem => {
    const entry = timeline.find(t => t.semana === sem);
    const t = entry?.actividades?.[0]?.texto || '';
    if (t) lastKnownTexto = t;
    textoMap[sem] = t;
  });

  let cellsHtml = '<div class="gantt-grid">';
  ventana.forEach(sem => {
    const semIdx = allSems.indexOf(sem);
    const inRange = firstIdxAll >= 0 && lastIdxAll >= 0
                    && semIdx >= firstIdxAll && semIdx <= lastIdxAll;
    const registrado = textoMap[sem] || '';
    // Para semanas vacías dentro del rango activo (incluida la extensión a hoy):
    // usar la última fase conocida del proyecto (forward-fill), no ph-pending
    let texto = registrado;
    let isFilled = false;
    if (!texto && !isParado && inRange) {
      // Encontrar la última fase registrada hasta esta semana
      let fill = '';
      for (let i = firstIdxAll; i <= semIdx; i++) {
        const s = allSems[i];
        if (textoMap[s]) fill = textoMap[s];
      }
      if (fill) { texto = fill; isFilled = true; }
    }
    const ph  = texto ? faseColor(texto) : '';
    const isParadaCell = !registrado && isParado && inRange;
    const cls = `gantt-cell${ph?' '+ph+' filled':''}${isFilled?' ph-continuidad':''}${isParadaCell?' ph9 filled':''}${sem===hoy?' gantt-cell-hoy':''}`;
    const title = `${sem}${registrado?': '+registrado:isFilled?': '+texto+' (continuidad de fase)':isParadaCell?' (proyecto parado)':''}`;
    const label = registrado ? abrev(registrado) : isParadaCell ? '···' : isFilled ? abrev(texto) : '';
    cellsHtml += `<div class="${cls}" title="${title}">${label?`<span class="gantt-label">${label}</span>`:''}</div>`;
  });
  cellsHtml += '</div>';

  return `<div class="gantt" style="overflow-x:auto;">${weeksHtml}${cellsHtml}</div>`;
}

/* ── Gantt completo (en el modal) ────────────────────────── */

/* Parsea etiquetas de fecha del Master como "30 oct'26", "Dic'26", "Ene'27", "TBD", "—"
   Devuelve un Date o null. */
function _parseFechaProyecto(str) {
  if (!str || str === '—' || str.toLowerCase() === 'tbd') return null;
  const MESES = {ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,oct:9,nov:10,dic:11};
  // "30 oct'26" → día 30, oct, 2026
  let m = str.match(/(\d{1,2})\s+([a-záéíóú]{3})'(\d{2})/i);
  if (m) {
    const mes = MESES[m[2].toLowerCase()];
    if (mes !== undefined) return new Date(2000 + parseInt(m[3]), mes, parseInt(m[1]));
  }
  // "Dic'26" → día 1, dic, 2026
  m = str.match(/([a-záéíóú]{3})'(\d{2})/i);
  if (m) {
    const mes = MESES[m[1].toLowerCase()];
    if (mes !== undefined) return new Date(2000 + parseInt(m[2]), mes, 1);
  }
  return null;
}

/* Parsea un label de semana como "5 OCT", "28 DIC", "3 ENE" → Date (lunes de esa semana, año actual/siguiente) */
function _parseSemLabel(label) {
  const MESES = {ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,oct:9,nov:10,dic:11};
  const m = label.match(/(\d{1,2})\s+([a-záéíóú]{2,3})/i);
  if (!m) return null;
  const mes = MESES[m[2].toLowerCase()];
  if (mes === undefined) return null;
  const hoyYear = new Date().getFullYear();
  // Si el mes ya pasó respecto a hoy, probablemente es el año siguiente
  const d1 = new Date(hoyYear, mes, parseInt(m[1]));
  const d2 = new Date(hoyYear + 1, mes, parseInt(m[1]));
  // Usar el año más cercano a la fecha actual que sea >= 3 meses antes de hoy
  const refDate = new Date(); refDate.setMonth(refDate.getMonth() - 3);
  return d1 >= refDate ? d1 : d2;
}

/* Genera labels de semanas adicionales a partir de la última semana conocida hasta targetDate */
function _extraWeekLabels(lastLabel, targetDate) {
  const MNAMES = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
  let cur = _parseSemLabel(lastLabel);
  if (!cur) return [];
  const extra = [];
  cur = new Date(cur.getTime() + 7 * 24 * 3600 * 1000); // siguiente semana
  let safety = 0;
  while (cur <= targetDate && safety < 52) {
    extra.push(`${cur.getDate()} ${MNAMES[cur.getMonth()]}`);
    cur = new Date(cur.getTime() + 7 * 24 * 3600 * 1000);
    safety++;
  }
  return extra;
}

function ganttCompleto(proj) {
  const baseSems = PLANNING_DATA?.semanas || [];
  const hoy      = hoySemana();
  if (!baseSems.length) return '<p style="color:var(--ink3);font-size:12px;">Sin datos de planning.</p>';

  // Calcular horizonte: max(fin_obra, montaje) del proyecto
  const dFinObra  = _parseFechaProyecto(proj.fin_obra  || '');
  const dMontaje  = _parseFechaProyecto(proj.montaje   || '');
  let targetDate = null;
  if (dFinObra && dMontaje) targetDate = dFinObra > dMontaje ? dFinObra : dMontaje;
  else targetDate = dFinObra || dMontaje;

  // Último label del planning base
  const lastBaseSem = baseSems[baseSems.length - 1];
  const dLastBase   = _parseSemLabel(lastBaseSem);

  // Añadir semanas sintéticas si targetDate supera el último label base
  // Añadimos un margen de +6 días para incluir la semana que contiene targetDate
  let sems = [...baseSems];
  if (targetDate && dLastBase) {
    const targetPlusPadding = new Date(targetDate.getTime() + 6 * 24 * 3600 * 1000);
    if (targetPlusPadding > dLastBase) {
      const extra = _extraWeekLabels(lastBaseSem, targetPlusPadding);
      sems = [...sems, ...extra];
    }
  }

  const N    = sems.length;
  const colW = `repeat(${N},minmax(28px,1fr))`;
  const minW = `${N * 30}px`; // para forzar scroll horizontal

  let weeksHtml = `<div style="display:grid;grid-template-columns:${colW};gap:1px;margin-bottom:2px;min-width:${minW};">`;
  sems.forEach(sem => {
    const isHoy = sem === hoy;
    const isSynt = !baseSems.includes(sem); // semana sintética (fuera del planning)
    weeksHtml += `<div style="font-size:8.5px;font-weight:${isHoy?700:500};letter-spacing:.02em;
      text-align:center;padding:3px 1px;
      color:${isHoy?'var(--burg)':isSynt?'var(--ink3)':'var(--ink3)'};
      opacity:${isSynt?0.55:1};
      border-bottom:${isHoy?'2px solid var(--burg)':'1px solid transparent'};">${sem}</div>`;
  });
  weeksHtml += '</div>';

  // Determinar si el proyecto está oficialmente parado
  const estadoRaw = (proj.estado || proj._g?.fase_real || proj.fase || '').toUpperCase();
  const isParado  = /PARAD|ESPERA|STANDBY|STOP|HOLD/.test(estadoRaw);

  // Determinar rango activo del proyecto: primera y última semana con actividad registrada
  const timeline   = proj._p?.timeline || [];
  const activeSems = new Set(timeline.filter(t => t.actividades?.length).map(t => t.semana));
  let firstActive  = null, lastActive = null;
  sems.forEach(sem => {
    if (activeSems.has(sem)) {
      if (!firstActive) firstActive = sem;
      lastActive = sem;
    }
  });
  // Si no está parado, extender lastActive hasta hoy (la semana actual también es "activa")
  if (!isParado && lastActive) {
    const lastIdx_ = sems.indexOf(lastActive);
    const hoyIdx_  = sems.indexOf(hoy);
    if (hoyIdx_ >= 0 && hoyIdx_ > lastIdx_) lastActive = hoy;
  }
  const firstIdx = firstActive ? sems.indexOf(firstActive) : -1;
  const lastIdx  = lastActive  ? sems.indexOf(lastActive)  : -1;

  // Mapa semana→fase para forward-fill: celdas vacías heredan la última fase conocida
  const textoMapC = {};
  sems.forEach(sem => {
    const entry = timeline.find(t => t.semana === sem);
    textoMapC[sem] = entry?.actividades?.[0]?.texto || '';
  });

  let cellsHtml = `<div style="display:grid;grid-template-columns:${colW};gap:1px;min-width:${minW};">`;
  sems.forEach((sem, i) => {
    const registrado = textoMapC[sem] || '';
    const isSynt     = !baseSems.includes(sem);
    const inActiveRange = firstIdx >= 0 && lastIdx >= 0 && i >= firstIdx && i <= lastIdx;
    // Forward-fill: semana vacía en rango activo hereda última fase conocida
    let texto = registrado;
    let isFilled = false;
    if (!texto && !isParado && inActiveRange) {
      let fill = '';
      for (let k = firstIdx; k <= i; k++) {
        if (textoMapC[sems[k]]) fill = textoMapC[sems[k]];
      }
      if (fill) { texto = fill; isFilled = true; }
    }
    const ph           = texto ? faseColor(texto) : '';
    const isParadaCell = !registrado && isParado && inActiveRange;
    const clsParts     = ['gantt-cell'];
    if (ph)           clsParts.push(ph, 'filled');
    if (isFilled)     clsParts.push('ph-continuidad');
    if (isParadaCell) clsParts.push('ph9', 'filled');
    if (sem === hoy)  clsParts.push('gantt-cell-hoy');
    const cls     = clsParts.join(' ');
    const bgStyle = isSynt && !texto && !isParadaCell ? 'background:rgba(0,0,0,.02);' : '';
    const titleTxt = registrado    ? `: ${registrado}`
                   : isFilled      ? `: ${texto} (continuidad de fase)`
                   : isParadaCell  ? ' (proyecto parado)'
                   : '';
    const labelTxt = registrado || isFilled ? abrev(texto) : isParadaCell ? '···' : '';
    cellsHtml += `<div class="${cls}" title="${sem}${titleTxt}"
      style="height:30px;display:flex;align-items:center;justify-content:center;border-radius:3px;${bgStyle}">
      ${labelTxt ? `<span class="gantt-label" style="font-size:8.5px;font-weight:600;">${labelTxt}</span>` : ''}
    </div>`;
  });
  cellsHtml += '</div>';

  const note = targetDate && sems.length > baseSems.length
    ? `<div style="font-size:9px;color:var(--ink3);margin-top:6px;opacity:.7;">
        * Semanas extendidas hasta ${targetDate.toLocaleDateString('es-ES',{month:'short',year:'numeric'})}
        (${dFinObra&&dMontaje?'max(fin obra, montaje)':dFinObra?'fin de obra previsto':'montaje previsto'})
       </div>`
    : '';

  return `<div style="overflow-x:auto;padding-bottom:4px;">${weeksHtml}${cellsHtml}${note}</div>`;
}

function _planningLegend() {
  const items = [
    ['ph1','Proyecto/Diseño'],['ph2','Obra'],['ph3','Montaje'],['ph4','Entrega'],
    ['ph5','Renders'],['ph6','Visita'],['ph7','Pedidos/Remates'],['ph9','Parada'],
    ['ph-continuidad ph1','Continuidad de fase'],['ph-pending','Sin planificación definida'],

/* ── Agrupación de personas por departamento ─────────────── */
const ORDEN_MANUAL = {
  'HOTELES':      ['Marta','Jesús','Jesus'],
  'RESTAURANTES': ['Sofía','Sofia','Naiara'],
  'VIVIENDA':     ['Olatz','Sara','Andrea','Paula','Cristina','Nela'],
  'SIN ASIGNAR':  []
};

function getPersonasByGroup() {
  const personas = getPersonas();

  function primaryDept(nombre) {
    const counts = { HOTELES: 0, RESTAURANTES: 0, VIVIENDA: 0 };
    (MASTER_DATA||[]).forEach(p => {
      if (!(p.equipo||[]).includes(nombre)) return;
      const d = (p.dpto||'').toUpperCase();
      if (d.includes('HOTEL'))             counts.HOTELES++;
      else if (d.includes('RESTAURANTE'))  counts.RESTAURANTES++;
      else if (d.includes('VIVIENDA'))     counts.VIVIENDA++;
    });
    for (const dept of ['HOTELES','RESTAURANTES','VIVIENDA']) {
      if (counts[dept] > 0 && counts[dept] === Math.max(...Object.values(counts))) return dept;
    }
    if (counts.HOTELES > 0)      return 'HOTELES';
    if (counts.RESTAURANTES > 0) return 'RESTAURANTES';
    if (counts.VIVIENDA > 0)     return 'VIVIENDA';
    return 'SIN ASIGNAR';
  }

  const DEPTS  = ['HOTELES','RESTAURANTES','VIVIENDA','SIN ASIGNAR'];
  const groups = {};
  DEPTS.forEach(d => { groups[d] = []; });
  personas.forEach(n => { groups[primaryDept(n)].push(n); });

  DEPTS.forEach(dept => {
    const manual = (ORDEN_MANUAL[dept]||[]).filter(n => groups[dept].includes(n));
    const resto  = groups[dept].filter(n => !manual.includes(n)).sort();
    groups[dept] = [...manual, ...resto];
  });

  return { groups, order: DEPTS };
}

/* ── CSS de grupos de pestañas ───────────────────────────── */
const GROUP_STYLES = {
  'HOTELES':      { bg: 'var(--hot)',  label: 'HOTELES' },
  'RESTAURANTES': { bg: 'var(--rest)', label: 'REST' },
  'VIVIENDA':     { bg: 'var(--viv)',  label: 'VIV' },
  'SIN ASIGNAR':  { bg: 'var(--cop)', label: '—' },
};

/* ── Tabs ─────────────────────────────────────────────────── */
// Orden: ALEJANDRA primero, JAVIER segundo, luego grupos por dept
let curTab = 'alejandra';

function buildTabs() {
  const tabsEl = document.getElementById('tabs');
  if (!tabsEl) return;
  const { groups, order } = getPersonasByGroup();

  let html = '';

  // Pestañas fijas: ALEJANDRA · DIRECCIÓN primero, JAVIER · CENTRO DE CONTROL segundo
  html += `<button class="tab${curTab==='alejandra'?' active':''}" data-tab="alejandra"
            style="font-weight:600;">ALEJANDRA · DIRECCIÓN</button>`;
  html += `<button class="tab tab-master${curTab==='javi'?' active':''}" data-tab="javi"
            style="font-weight:600;">JAVIER · CENTRO DE CONTROL</button>`;

  // Separador
  html += `<div style="width:1px;background:var(--line);margin:4px 4px;align-self:stretch;opacity:.4;"></div>`;

  // Grupos por departamento (HOTELES, REST, VIV)
  order.forEach(dept => {
    const people = groups[dept];
    if (!people.length) return;
    const st = GROUP_STYLES[dept] || {};

    html += `<div class="tab-group" style="
      display:flex;align-items:center;gap:2px;
      background:color-mix(in srgb,${st.bg} 18%,transparent);
      border-radius:6px;padding:2px 6px;
      border:1px solid color-mix(in srgb,${st.bg} 30%,transparent);">`;

    people.forEach(nombre => {
      const slug = nombre.toLowerCase().replace(/\s+/g,'_').replace(/[áa]/g,'a').replace(/[éeê]/g,'e');
      const id   = `p__${slug}`;
      html += `<button class="tab${curTab===id?' active':''}" data-tab="${id}"
               style="white-space:nowrap;font-size:11px;">${nombre}</button>`;
    });
    html += `</div>`;
  });

  tabsEl.innerHTML = html;
}

function activateTab(id) {
  curTab = id;
  document.querySelectorAll('#tabs .tab').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === id));

  if      (id === 'alejandra') renderAlejandra();
  else if (id === 'javi')      renderJavi();
  else if (id.startsWith('p__')) {
    const slug   = id.slice(3);
    // Buscar la persona cuyo slug coincida
    const nombre = getPersonas().find(n => {
      const ns = n.toLowerCase().replace(/\s+/g,'_').replace(/[áa]/g,'a').replace(/[éeê]/g,'e');
      return ns === slug;
    });
    if (nombre) renderPersona(nombre);
  }
}

/* ── COLORES DE BLOQUES para índices ────────────────────────
   Deben coincidir con los fondos de los paneles.
   ──────────────────────────────────────────────────────────*/
const BG_ALERTA    = 'rgba(180,30,30,.08)';
const BG_ATENCION  = 'rgba(196,122,42,.07)';
const BG_INFO      = 'rgba(80,80,140,.05)';
const BG_CONTROLADO= 'rgba(0,0,0,.03)';
const BG_SEMANA    = 'rgba(42,100,140,.06)';
const BG_PROX      = 'rgba(42,120,80,.05)';
const BG_OTROS     = 'rgba(0,0,0,.02)';

const BORDE_ALERTA    = '#b41e1e';
const BORDE_ATENCION  = '#c47a2a';
const BORDE_INFO      = '#50508c';
const BORDE_CONTROLADO= '#aaaaaa';
const BORDE_SEMANA    = '#2a648c';
const BORDE_PROX      = '#2a7850';
const BORDE_OTROS     = '#cccccc';

function indexBtn(id, label, bg, borde, count) {
  if (!count) return '';
  return `<a href="#${id}" class="idx-btn"
    style="background:${bg};border:1px solid ${borde};color:${borde};">
    ${label} <span style="font-weight:300;opacity:.7;">${count}</span>
  </a>`;
}

/* ── Render Alejandra — DIRECCIÓN ─────────────────────────── */
function renderAlejandra() {
  const todos = (MASTER_DATA||[]).map(enrich);
  const sem   = hoySemana();

  const alerta   = todos.filter(p => atLevel(p) === 0);
  const atencion = todos.filter(p => atLevel(p) === 1);

  const estaSemanaAlert  = todos.filter(p => atLevel(p) <= 1 && projHasActivityThisWeek(p));
  const estaSemanaNormal = todos.filter(p => atLevel(p) > 1  && projHasActivityThisWeek(p));
  const estaSemana = [...estaSemanaAlert, ...estaSemanaNormal];

  const proximamente = todos
    .filter(p => projHasActivityInWindow(p, 1, 3))
    .sort((a,b) => {
      const da = a._g?.fecha_hito||'', db = b._g?.fecha_hito||'';
      return da < db ? -1 : da > db ? 1 : 0;
    });

  // Índice
  const indiceHtml = `
    <div class="idx-nav" style="margin-bottom:20px;">
      ${indexBtn('ale-alerta',    '● ALERTA',      BG_ALERTA,    BORDE_ALERTA,    alerta.length)}
      ${indexBtn('ale-atencion',  '● ATENCIÓN',    BG_ATENCION,  BORDE_ATENCION,  atencion.length)}
      ${indexBtn('ale-semana',    'ESTA SEMANA',   BG_SEMANA,    BORDE_SEMANA,    estaSemana.length)}
      ${indexBtn('ale-prox',      'PRÓXIMAMENTE',  BG_PROX,      BORDE_PROX,      proximamente.length)}
    </div>`;

  let html = `<div class="view-head">
    <div>
      <div class="view-title">DIRECCIÓN</div>
      <div class="view-sub">${sem} · ${todos.length} proyectos</div>
    </div>
  </div>
  ${indiceHtml}`;

  html += `<div id="ale-alerta" class="panel" style="background:${BG_ALERTA};border-left:3px solid ${BORDE_ALERTA};">
    <div class="panel-head">${tagHtml('tag-crit','● ALERTA')}&ensp;<span style="font-weight:300;color:var(--ink3);">${alerta.length}</span></div>
    ${alerta.length ? alerta.map(p => projCard(p,{gantt:true})).join('') : '<p class="panel-note">Sin proyectos en alerta.</p>'}
  </div>`;

  html += `<div id="ale-atencion" class="panel" style="background:${BG_ATENCION};border-left:3px solid ${BORDE_ATENCION};">
    <div class="panel-head">${tagHtml('tag-alto','● ATENCIÓN')}&ensp;<span style="font-weight:300;color:var(--ink3);">${atencion.length}</span></div>
    ${atencion.length ? atencion.map(p => projCard(p,{gantt:true})).join('') : '<p class="panel-note">Sin proyectos en atención.</p>'}
  </div>`;

  if (estaSemana.length) {
    html += `<div id="ale-semana" class="panel" style="background:${BG_SEMANA};border-left:3px solid ${BORDE_SEMANA};">
      <div class="panel-head"><span class="eyebrow">ESTA SEMANA</span> <span style="font-size:11px;color:var(--ink3);font-weight:300;">${sem}</span></div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Proyecto</th><th>Dpto</th><th>Actividad</th><th>Próximo hito</th><th>Fecha</th></tr></thead>
        <tbody>
          ${estaSemana.map(p => {
            const entry = (p._p?.timeline||[]).find(t => t.semana === sem);
            const act   = (entry?.actividades||[]).map(a=>a.texto).join(', ') || '—';
            return `<tr style="cursor:pointer;" data-open="${p.id}">
              <td><strong>${p.nombre}</strong></td>
              <td>${tagHtml(...deptTag(p.dpto))}</td>
              <td style="color:var(--ink2);">${act}</td>
              <td style="color:var(--ink2);">${p._g?.proximo_hito||'—'}</td>
              <td style="color:var(--cop);">${p._g?.fecha_hito||'—'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table></div>
    </div>`;
  }

  if (proximamente.length) {
    html += `<div id="ale-prox" class="panel" style="background:${BG_PROX};border-left:3px solid ${BORDE_PROX};">
      <div class="panel-head"><span class="eyebrow">PRÓXIMAMENTE</span></div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Proyecto</th><th>Dpto</th><th>Hito</th><th>Fecha</th></tr></thead>
        <tbody>
          ${proximamente.map(p => `<tr style="cursor:pointer;" data-open="${p.id}">
            <td><strong>${p.nombre}</strong></td>
            <td>${tagHtml(...deptTag(p.dpto))}</td>
            <td style="color:var(--ink2);">${p._g?.proximo_hito||'—'}</td>
            <td style="color:var(--cop);">${p._g?.fecha_hito||'—'}</td>
          </tr>`).join('')}
        </tbody>
      </table></div>
    </div>`;
  }

  document.getElementById('view').innerHTML = html;
}

/* ── Render Javi — CENTRO DE CONTROL ──────────────────────── */
function renderJavi() {
  const todos = (MASTER_DATA||[]).map(enrich);
  const sem   = hoySemana();

  const GRUPOS = [
    { level:0, id:'javi-alerta',     label:'● ALERTA',        cls:'tag-crit', bg:BG_ALERTA,     borde:BORDE_ALERTA,    withGantt:true  },
    { level:1, id:'javi-atencion',   label:'● ATENCIÓN',      cls:'tag-alto', bg:BG_ATENCION,   borde:BORDE_ATENCION,  withGantt:true  },
    { level:2, id:'javi-info',       label:'● INFO FALTANTE', cls:'tag-med',  bg:BG_INFO,       borde:BORDE_INFO,      withGantt:false },
    { level:3, id:'javi-controlado', label:'● CONTROLADO',    cls:'tag-baj',  bg:BG_CONTROLADO, borde:BORDE_CONTROLADO,withGantt:false },
  ];

  GRUPOS.forEach(g => { g.projs = todos.filter(p => atLevel(p) === g.level); });

  const indiceHtml = `
    <div class="idx-nav" style="margin-bottom:20px;">
      ${GRUPOS.map(g => indexBtn(g.id, g.label, g.bg, g.borde, g.projs.length)).join('')}
    </div>`;

  let html = `<div class="view-head">
    <div>
      <div class="view-title">CENTRO DE CONTROL</div>
      <div class="view-sub">${sem} · ${todos.length} proyectos</div>
    </div>
  </div>
  ${indiceHtml}`;

  GRUPOS.forEach(g => {
    if (!g.projs.length) return;
    html += `<div id="${g.id}" class="panel" style="background:${g.bg};border-left:3px solid ${g.borde};">
      <div class="panel-head">
        <span class="eyebrow">${tagHtml(g.cls, g.label)}&ensp;<span style="font-weight:300;color:var(--ink3);">${g.projs.length}</span></span>
      </div>
      ${g.projs.map(p => projCard(p, {gantt: g.withGantt})).join('')}
    </div>`;
  });

  document.getElementById('view').innerHTML = html;
}

/* ── Render Persona ──────────────────────────────────────── */
function renderPersona(nombre) {
  const todos = (MASTER_DATA||[]).filter(p => (p.equipo||[]).includes(nombre)).map(enrich);
  const sem   = hoySemana();

  const prioridad      = todos.filter(p => atLevel(p) <= 1).sort((a,b) => atLevel(a)-atLevel(b));
  const prioIds        = new Set(prioridad.map(p => p.id));
  const estaSemana     = todos.filter(p => !prioIds.has(p.id) && projHasActivityThisWeek(p));
  const estaIds        = new Set(estaSemana.map(p => p.id));
  const otrosProyectos = todos.filter(p => !prioIds.has(p.id) && !estaIds.has(p.id));

  const indiceHtml = `
    <div class="idx-nav" style="margin-bottom:20px;">
      ${indexBtn('sec-PRIORIDAD',       '● PRIORIDAD',       BG_ALERTA,   BORDE_ALERTA,   prioridad.length)}
      ${indexBtn('sec-ESTA-SEMANA',     'ESTA SEMANA',       BG_SEMANA,   BORDE_SEMANA,   estaSemana.length)}
      ${indexBtn('sec-OTROS-PROYECTOS', 'OTROS PROYECTOS',   BG_OTROS,    BORDE_OTROS,    otrosProyectos.length)}
    </div>`;

  let html = `<div class="view-head">
    <div>
      <div class="view-title">${nombre}</div>
      <div class="view-sub">${todos.length} proyecto${todos.length!==1?'s':''}</div>
    </div>
  </div>
  ${indiceHtml}`;

  if (prioridad.length) {
    html += `<div id="sec-PRIORIDAD" class="panel" style="background:${BG_ALERTA};border-left:3px solid ${BORDE_ALERTA};">
      <div class="panel-head">${tagHtml('tag-crit','● PRIORIDAD')}&ensp;<span style="font-weight:300;color:var(--ink3);">${prioridad.length}</span></div>
      ${prioridad.map(p => projCard(p, {gantt:true})).join('')}
    </div>`;
  }

  if (estaSemana.length) {
    html += `<div id="sec-ESTA-SEMANA" class="panel" style="background:${BG_SEMANA};border-left:3px solid ${BORDE_SEMANA};">
      <div class="panel-head"><span class="eyebrow">ESTA SEMANA · ${sem}</span></div>
      ${estaSemana.map(p => projCard(p, {gantt:true})).join('')}
    </div>`;
  }

  if (otrosProyectos.length) {
    html += `<div id="sec-OTROS-PROYECTOS" class="panel" style="background:${BG_OTROS};border-left:3px solid ${BORDE_OTROS};">
      <div class="panel-head"><span class="eyebrow">OTROS PROYECTOS · ${otrosProyectos.length}</span></div>
      ${otrosProyectos.map(p => projCard(p, {gantt:true})).join('')}
    </div>`;
  }

  if (!todos.length) {
    html += '<p class="panel-note" style="margin-top:20px;">Sin proyectos asignados.</p>';
  }

  document.getElementById('view').innerHTML = html;
}

/* ── Exportar ─────────────────────────────────────────────── */
function exportar() {
  const hoy  = new Date().toLocaleDateString('es-ES');
  const sem  = hoySemana();
  const lines = [`POMBO ESTUDIO — ${hoy} (${sem})`, '='.repeat(50), ''];

  ['VIVIENDA','RESTAURANTES','HOTELES'].forEach(dpto => {
    const ps = (MASTER_DATA||[]).filter(p => (p.dpto||'').toUpperCase().includes(dpto.slice(0,-1)||dpto));
    if (!ps.length) return;
    lines.push(`\n── ${dpto} (${ps.length}) ──`);
    ps.forEach(p => {
      const g = globalOf(p.id);
      lines.push(`  ${p.nombre}`);
      if (g?.atencion)     lines.push(`    ${g.atencion}`);
      if (g?.proximo_hito) lines.push(`    → ${g.proximo_hito}${g.fecha_hito?' ('+g.fecha_hito+')':''}`);
      if (g?.bloqueador)   lines.push(`    ⚠ ${g.bloqueador}`);
    });
  });

  const blob = new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8'});
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = `pombo_${(sem||'export').replace('/','_')}.txt`;
  a.click();
}

/* ── CSS dinámico ─────────────────────────────────────────── */
function injectStyles() {
  const css = `
    /* Botón VER con fondo corporativo */
    .btn-ver {
      font-size:10.5px;font-weight:600;letter-spacing:.07em;
      padding:5px 12px;white-space:nowrap;flex-shrink:0;
      background:var(--burg,#4a2020);color:#fff;
      border:none;border-radius:4px;cursor:pointer;
      transition:opacity .15s;
    }
    .btn-ver:hover { opacity:.82; }

    /* Índice de navegación */
    .idx-nav {
      display:flex;flex-wrap:wrap;gap:8px;
    }
    .idx-btn {
      font-size:10.5px;font-weight:600;letter-spacing:.07em;
      padding:5px 13px;border-radius:4px;text-decoration:none;
      transition:opacity .15s;
    }
    .idx-btn:hover { opacity:.75; }

    /* Paneles */
    .panel { margin-bottom:16px;border-radius:6px;padding:14px 16px; }
    .panel-note { font-size:12px;color:var(--ink3);padding:8px 0; }

    /* Modal */
    .modal-section { margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line); }
    .modal-section:last-child { border-bottom:none; }
    .modal-section-label {
      font-size:9.5px;font-weight:700;letter-spacing:.1em;
      text-transform:uppercase;color:var(--ink3);margin-bottom:8px;
    }

    /* Tab groups */
    .tab-group { display:inline-flex; }

    /* Scroll en modal en pantallas pequeñas */
    @media (max-width:780px) {
      .modal > .modal-body { grid-template-columns:1fr !important; }
      .modal > .modal-body > div:nth-child(2) { border-left:none !important; padding-left:0 !important; border-top:1px solid var(--line); padding-top:16px; }
    }
  `;
  const el = document.createElement('style');
  el.textContent = css;
  document.head.appendChild(el);
}

/* ── Eventos ──────────────────────────────────────────────── */
function wireEvents() {
  document.getElementById('tabs')?.addEventListener('click', e => {
    const b = e.target.closest('.tab');
    if (b) activateTab(b.dataset.tab);
  });

  document.getElementById('view')?.addEventListener('click', e => {
    const open = e.target.closest('[data-open]');
    if (open) { openModal(open.dataset.open); return; }
  });

  document.getElementById('export-btn')?.addEventListener('click', exportar);
  document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });
}

/* ── Init ─────────────────────────────────────────────────── */
function init() {
  injectStyles();
  buildIndexes();
  buildTabs();
  wireEvents();
  activateTab('alejandra');  // Alejandra es la pestaña inicial

  const wb = document.getElementById('week-badge');
  if (wb) wb.textContent = hoySemana();

  const ub = document.getElementById('update-badge');
  if (ub && META?.updated) ub.textContent = 'Act. ' + META.updated;
}

document.addEventListener('DOMContentLoaded', init);

</script>
