name: Bizneo – Sync ausencias

# ─────────────────────────────────────────────────────────────────────────────
# Ejecuta bizneo_sync.py diariamente ANTES que generate_app.py para que
# la App y el PDF reciban las ausencias actualizadas.
#
# PENDIENTE (Fase 2):
#   - Añadir job "regenerate_app" que llame a generate_app.py tras sync exitosa.
#   - Añadir notificación (Slack / email) si hay eventos SIN_IDENTIFICAR.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # 07:00 hora Madrid (UTC+1 invierno / UTC+2 verano)
    # Ajustar a 05:00 UTC en verano si se quiere mantener las 07:00 locales.
    - cron: '0 6 * * *'
  workflow_dispatch:       # ejecución manual desde GitHub Actions

jobs:
  sync:
    name: Sincronizar ausencias Bizneo
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install openpyxl icalendar

      - name: Ejecutar sync
        env:
          BIZNEO_ICAL_URL: ${{ secrets.BIZNEO_ICAL_URL }}
        run: python bizneo_sync.py

      - name: Confirmar cambios en Excel
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PM_ESTUDIO_MASTER_COMPLETO.xlsx
          git diff --staged --quiet || \
            git commit -m "sync: ausencias Bizneo $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

